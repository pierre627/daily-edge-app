<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:linear-gradient(180deg,#1B2430 0%,#171F29 100%);background-attachment:fixed;padding:28px 16px 60px;font-family:'Source Serif 4',Georgia,serif;color:#F6F1E4}

/* ── Login ── */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;margin:-28px -16px 0;background:linear-gradient(180deg,#1B2430,#0F1720)}
.login-card{background:rgba(246,241,228,.06);border:1px solid rgba(246,241,228,.1);border-radius:6px;padding:40px 32px;text-align:center;max-width:320px;width:100%}
.login-icon{font-size:44px;margin-bottom:14px}
.login-title{font-size:22px;font-weight:600;color:#F6F1E4;margin-bottom:4px;letter-spacing:.3px}
.login-sub{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.5px;color:#8A9BA8;margin-bottom:28px}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;background:#F6F1E4;border:none;border-radius:3px;padding:12px 24px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:#1B2430;cursor:pointer;width:100%;letter-spacing:.4px;text-transform:uppercase}
.btn-google img{width:18px;height:18px}

/* ── App ── */
#app{max-width:900px;margin:0 auto;display:none}
.ledger-title{font-size:28px;font-weight:600;letter-spacing:.3px;margin-bottom:2px}
.ledger-meta{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.ledger-stats{font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A9BA8;letter-spacing:.5px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#B8925A;opacity:0;transition:opacity .3s}
.sync-dot.show{opacity:1}
.sync-dot.offline{background:#D98080;opacity:1}
.controls{display:flex;gap:10px;margin-bottom:28px;align-items:center}
.search-wrap{position:relative;flex:1}
.search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#6B7680;font-size:13px;pointer-events:none}
#searchInput{width:100%;padding:9px 10px 9px 32px;border-radius:3px;border:1px solid #3A4552;background:#212B36;color:#F6F1E4;font-size:13px;font-family:'Source Serif 4',Georgia,serif;outline:none}
#searchInput::placeholder{color:#4A5A6A}
#searchInput:focus{border-color:#5C7A8A}
.add-btn{display:flex;align-items:center;gap:6px;padding:9px 16px;background:#B8925A;color:#1B2430;border:none;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;white-space:nowrap;flex-shrink:0}

/* ── Status groups ── */
.group{margin-bottom:28px}
.group-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.group-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.group-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8A9BA8}

/* ── Book spines ── */
.spine-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.spine{border-radius:2px 6px 6px 2px;padding:14px 10px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:2px 3px 8px rgba(0,0,0,.35);position:relative;cursor:pointer;transition:transform .15s ease;-webkit-user-select:none;user-select:none}
.spine:active{transform:translateY(-2px)}
@media(hover:hover){.spine:hover{transform:translateY(-4px)}}
.spine-check{position:absolute;top:8px;right:8px;font-size:12px;color:rgba(246,241,228,.85)}
.spine-title{font-size:13px;font-weight:600;color:#F6F1E4;line-height:1.3;word-break:break-word}
.spine-author{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(246,241,228,.7);letter-spacing:.3px;line-height:1.4;margin-top:4px}
.spine-bar{margin-top:6px;background:rgba(0,0,0,.25);height:3px;border-radius:2px}
.spine-bar-fill{background:#F6F1E4;height:3px;border-radius:2px}

/* ── Modal ── */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
.modal-card{background:#F6F1E4;border-radius:4px;padding:22px 20px;width:100%;max-width:420px;font-family:'Source Serif 4',Georgia,serif;color:#2A2620;box-shadow:0 12px 30px rgba(0,0,0,.45);max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}
.modal-head-text{flex:1}
.modal-title{font-size:20px;font-weight:600;line-height:1.25}
.modal-author{font-family:'JetBrains Mono',monospace;font-size:12px;color:#8A8477;margin-top:3px}
.modal-close{background:none;border:none;color:#8A8477;font-size:26px;cursor:pointer;line-height:1;padding:0;flex-shrink:0}

/* form labels + inputs */
.m-label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#8A8477;margin-bottom:4px}
.m-input{width:100%;padding:8px 10px;margin-bottom:14px;border:1px solid #D8D0BC;border-radius:3px;background:#FFFDF8;font-size:15px;font-family:'Source Serif 4',Georgia,serif;color:#2A2620;outline:none;-webkit-appearance:none}
.m-input:focus{border-color:#B8925A}
.m-input::placeholder{color:#C0B8A8}
.m-row{display:flex;gap:12px;margin-bottom:0}
.m-col{flex:1}
.m-col .m-input{width:100%}

/* status pills */
.status-pills{display:flex;gap:8px;margin-bottom:14px}
.s-pill{flex:1;padding:8px 4px;border-radius:3px;background:transparent;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;color:#2A2620;transition:all .15s;border:1px solid #D8D0BC}

/* stars */
.stars{display:flex;gap:2px;margin-bottom:14px}
.star-btn{background:none;border:none;cursor:pointer;padding:2px;font-size:22px;color:#D8D0BC;line-height:1;transition:color .1s;font-family:sans-serif}
.star-btn.on{color:#B8925A}

/* view details */
.v-stars{display:flex;gap:2px;margin:12px 0 8px}
.v-star{font-size:18px;color:#D8D0BC;font-family:sans-serif}
.v-star.on{color:#B8925A}
.v-pages{font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8477;margin-bottom:10px}
.v-notes{font-size:14px;line-height:1.55;font-style:italic;color:#514C40;border-left:2px solid #D8D0BC;padding-left:12px;margin-bottom:14px}
.v-dates{font-family:'JetBrains Mono',monospace;font-size:10px;color:#B8B2A0;margin-bottom:16px}
.modal-btns{display:flex;gap:8px}
.m-btn{flex:1;padding:9px 0;border:none;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer}
.m-btn.primary{background:#2A2620;color:#F6F1E4}
.m-btn.danger{background:transparent;color:#7A2E2E;border:1px solid #7A2E2E}
.save-btn{width:100%;margin-top:8px;padding:11px 0;background:#2A2620;color:#F6F1E4;border:none;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.6px;text-transform:uppercase;cursor:pointer}
.save-btn:disabled{background:#C0B8A8;cursor:default}

/* Kindle autocomplete */
.ac-wrap{position:relative}
.ac-wrap .m-input{margin-bottom:0}
.ac-results{position:absolute;top:100%;left:0;right:0;background:#FFFDF8;border:1px solid #D8D0BC;border-top:none;border-radius:0 0 3px 3px;max-height:160px;overflow-y:auto;z-index:10;display:none;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.ac-results.show{display:block}
.ac-item{padding:8px 10px;cursor:pointer;border-bottom:1px solid #EEE8D8}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item:active{background:#EEE8D8}
.ac-item-title{font-size:13px;font-weight:600;color:#2A2620}
.ac-item-author{font-family:'JetBrains Mono',monospace;font-size:10px;color:#8A8477;margin-top:1px}
.ac-gap{margin-bottom:14px}

/* misc */
.empty-shelf{color:#4A5A6A;font-style:italic;text-align:center;padding:60px 0;font-size:16px;line-height:1.6}
.error-bar{color:#D98080;font-family:'JetBrains Mono',monospace;font-size:12px;margin-bottom:14px}
</style>
</head>

</div>

// ═══════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════
const STATUSES = [
  {key:'reading',  label:'Reading',      color:'#B8925A'},
  {key:'want',     label:'Want to Read', color:'#5C7A8A'},
  {key:'finished', label:'Finished',     color:'#7A8A5C'},
];
const SPINE_COLORS = ['#7A2E2E','#2E4A3F','#3A4A6B','#6B4A2E','#4A2E4A','#2E5A5A'];

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let currentUser = null;
let books = [];
let modalMode = null;
let editingBook = null;
let formStatus = 'want';
let formRating = 0;
let _acResults = [];
let saveTimer = null;

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(iso){ try{return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return '';} }

function hashColor(s){
  let h=0; for(let i=0;i<s.length;i++) h=s.charCodeAt(i)+((h<<5)-h);
  return SPINE_COLORS[Math.abs(h)%SPINE_COLORS.length];
}

// ═══════════════════════════════════════════
// SEED BOOKS
// ═══════════════════════════════════════════
function buildSeedBooks(){
  const now=new Date(), cm=now.getMonth()+1, yr=now.getFullYear();
  return PROGRAM_2026.map(b=>{
    let status='want', finishedAt=null;
    if(b.month<cm){ status='finished'; finishedAt=new Date(yr,b.month,0).toISOString(); }
    else if(b.month===cm){ status='reading'; }
    return {id:uid(),title:b.title,author:b.author,status,rating:0,notes:'',
      pages:null,currentPage:0,addedAt:new Date(yr,b.month-1,1).toISOString(),finishedAt};
  });
}

// ═══════════════════════════════════════════
// OFFLINE / STORAGE
// ═══════════════════════════════════════════
const lsBookKey  = ()=>`rl_books_${currentUser?.id}`;
const lsSeedKey  = ()=>`rl_seeded_${currentUser?.id}`;

function saveLocal(b){ try{localStorage.setItem(lsBookKey(),JSON.stringify(b));}catch(e){} }
function loadLocal(){ try{const v=localStorage.getItem(lsBookKey());return v?JSON.parse(v):null;}catch(e){return null;} }
function isSeededLocal(){ return localStorage.getItem(lsSeedKey())==='1'; }
function markSeededLocal(){ try{localStorage.setItem(lsSeedKey(),'1');}catch(e){} }

function setSyncStatus(s){
  const dot=document.getElementById('syncDot'); if(!dot) return;
  dot.classList.remove('show','offline');
  if(s==='saving') dot.classList.add('show');
  if(s==='offline') dot.classList.add('offline');
}

window.addEventListener('online',  ()=>{ setSyncStatus(''); flushToSupabase(); });
window.addEventListener('offline', ()=>setSyncStatus('offline'));

// ═══════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════
function cacheUser(u){ try{localStorage.setItem('rl_user',JSON.stringify({id:u.id,email:u.email}));}catch(e){} }
function getCachedUser(){ try{const v=localStorage.getItem('rl_user');return v?JSON.parse(v):null;}catch(e){return null;} }

sb.auth.onAuthStateChange((event,session)=>{
  if(session?.user){
    currentUser=session.user; cacheUser(session.user);
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='block';
    startApp();
  } else {
    const cached=getCachedUser();
    if(cached&&!navigator.onLine){
      currentUser=cached;
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('app').style.display='block';
      startApp(); setSyncStatus('offline');
    } else {
      currentUser=null;
      document.getElementById('loginScreen').style.display='flex';
      document.getElementById('app').style.display='none';
    }
  }
});

async function signIn(){
  await sb.auth.signInWithOAuth({provider:'google',
    options:{redirectTo:location.href.split('#')[0].split('?')[0]}});
}

// ═══════════════════════════════════════════
// STARTUP
// ═══════════════════════════════════════════
async function startApp(){
  const cached=loadLocal();
  if(cached){ books=cached; render(); }

  try {
    const{data}=await sb.from('reading_tracker').select('key,data').eq('user_id',currentUser.id);
    if(!data) return;
    const bRow=data.find(r=>r.key==='books');
    const sRow=data.find(r=>r.key==='seeded_2026');

    if(bRow?.data?.books?.length){
      books=bRow.data.books;
      saveLocal(books);
    } else if(!sRow&&!isSeededLocal()){
      books=buildSeedBooks();
      saveLocal(books); markSeededLocal();
      await sb.from('reading_tracker').upsert([
        {user_id:currentUser.id,key:'books',data:{books},updated_at:new Date().toISOString()},
        {user_id:currentUser.id,key:'seeded_2026',data:{done:true},updated_at:new Date().toISOString()},
      ],{onConflict:'user_id,key'});
    } else if(!bRow&&(sRow||isSeededLocal())&&cached){
      flushToSupabase();
    }
  } catch(e){}
  render();
}

async function flushToSupabase(){
  if(!currentUser||!navigator.onLine) return;
  setSyncStatus('saving');
  try {
    const{error}=await sb.from('reading_tracker').upsert(
      {user_id:currentUser.id,key:'books',data:{books},updated_at:new Date().toISOString()},
      {onConflict:'user_id,key'}
    );
    setSyncStatus(error?'offline':'');
    showError(error?'Sync failed — will retry when online.':null);
  } catch(e){ setSyncStatus('offline'); }
}

function persistBooks(){
  saveLocal(books);
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flushToSupabase,800);
}

function showError(msg){
  const el=document.getElementById('errorBar');
  if(!el) return;
  el.textContent=msg||''; el.style.display=msg?'block':'none';
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function render(){ renderStats(); renderShelf(); }

function renderStats(){
  const yr=new Date().getFullYear();
  const fin=books.filter(b=>b.finishedAt&&new Date(b.finishedAt).getFullYear()===yr);
  const pages=fin.reduce((s,b)=>s+(b.pages||0),0);
  const avgR=fin.length?(fin.reduce((s,b)=>s+(b.rating||0),0)/fin.length).toFixed(1):null;
  const el=document.getElementById('ledgerStats');
  if(el) el.textContent=[
    `${fin.length} finished in ${yr}`,
    pages>0?`${pages.toLocaleString()} pages`:null,
    avgR&&avgR>'0.0'?`avg ${avgR}★`:null,
  ].filter(Boolean).join(' · ');
}

function renderShelf(){
  const q=(document.getElementById('searchInput')?.value||'').toLowerCase();
  const filtered=q?books.filter(b=>
    b.title.toLowerCase().includes(q)||b.author.toLowerCase().includes(q)
  ):books;
  const shelf=document.getElementById('shelf'); if(!shelf) return;
  if(!books.length){
    shelf.innerHTML='<div class="empty-shelf">The shelf is empty.<br>Add the book you\'re reading now to start the ledger.</div>';
    return;
  }
  const html=STATUSES.map(s=>{
    const grp=filtered.filter(b=>b.status===s.key);
    if(!grp.length) return '';
    return `<div class="group">
      <div class="group-head">
        <div class="group-dot" style="background:${s.color}"></div>
        <span class="group-label">${s.label} (${grp.length})</span>
      </div>
      <div class="spine-grid">
        ${grp.map(b=>spineHtml(b)).join('')}
      </div>
    </div>`;
  }).join('');
  shelf.innerHTML=html||'<div class="empty-shelf" style="padding:30px 0">No books match your search.</div>';
}

function spineHtml(b){
  const color=hashColor(b.title+b.author);
  const prog=(b.pages&&b.currentPage)?Math.min(100,Math.round(b.currentPage/b.pages*100)):null;
  const bar=prog!==null&&b.status==='reading'
    ?`<div class="spine-bar"><div class="spine-bar-fill" style="width:${prog}%"></div></div>`:'';
  const check=b.status==='finished'?'<div class="spine-check">✓</div>':'';
  return `<div class="spine" onclick="openModal('view','${b.id}')"
    style="background:linear-gradient(180deg,${color},${color}CC)">
    ${check}
    <div class="spine-title">${esc(b.title)}</div>
    <div>
      <div class="spine-author">${esc(b.author)}</div>
      ${bar}
    </div>
  </div>`;
}

// ═══════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════
function openModal(mode, bookId){
  modalMode=mode;
  editingBook=bookId?books.find(b=>b.id===bookId):null;
  formStatus=editingBook?.status||'want';
  formRating=editingBook?.rating||0;
  document.getElementById('modalCard').innerHTML=mode==='view'?viewHtml(editingBook):formHtml(editingBook);
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.getElementById('kindleResults')?.classList.remove('show');
  document.body.style.overflow='';
}

// ── View card ──
function viewHtml(b){
  const stars=[1,2,3,4,5].map(n=>`<span class="v-star${n<=(b.rating||0)?' on':''}">★</span>`).join('');
  const progress=(b.pages&&b.currentPage)
    ?`<div class="v-pages">${b.currentPage} / ${b.pages} pages${b.status==='reading'?' · '+Math.round(b.currentPage/b.pages*100)+'%':''}</div>`:'';
  const notes=b.notes?`<div class="v-notes">${esc(b.notes)}</div>`:'';
  const dates=`<div class="v-dates">Added ${fmtDate(b.addedAt)}${b.finishedAt?' · Finished '+fmtDate(b.finishedAt):''}</div>`;
  const statusInfo=STATUSES.find(s=>s.key===b.status);
  return `
    <div class="modal-head">
      <div class="modal-head-text">
        <div class="modal-title">${esc(b.title)}</div>
        <div class="modal-author">${esc(b.author)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <div style="width:8px;height:8px;border-radius:50%;background:${statusInfo?.color||'#8A8477'};flex-shrink:0"></div>
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#8A8477">${statusInfo?.label||''}</span>
    </div>
    <div class="v-stars">${stars}</div>
    ${progress}
    ${notes}
    ${dates}
    <div class="modal-btns">
      <button class="m-btn primary" onclick="openModal('edit','${b.id}')">Edit</button>
      <button class="m-btn danger" onclick="deleteBook('${b.id}')">Remove</button>
    </div>`;
}

// ── Form ──
function formHtml(b){
  const pills=STATUSES.map(s=>{
    const active=(b?.status||'want')===s.key;
    return `<button type="button" class="s-pill" id="pill_${s.key}" onclick="selectStatus('${s.key}')"
      style="${active?`border:2px solid ${s.color};background:${s.color}22;`:'border:1px solid #D8D0BC;'}"
      >${s.label}</button>`;
  }).join('');
  const stars=[1,2,3,4,5].map(n=>
    `<button type="button" class="star-btn${n<=(b?.rating||0)?' on':''}" onclick="setRating(${n})">★</button>`
  ).join('');
  return `
    <div class="modal-head">
      <div class="modal-title">${b?'Edit Entry':'New Entry'}</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <label class="m-label">Title</label>
    <div class="ac-wrap ac-gap">
      <input class="m-input" id="fTitle" placeholder="The Name of the Rose" value="${esc(b?.title||'')}"
        oninput="onAcInput(this.value)" autocomplete="off" autocorrect="off" autofocus>
      <div class="ac-results" id="kindleResults"></div>
    </div>
    <label class="m-label">Author</label>
    <input class="m-input" id="fAuthor" placeholder="Umberto Eco" value="${esc(b?.author||'')}">
    <label class="m-label">Status</label>
    <div class="status-pills">${pills}</div>
    <div class="m-row">
      <div class="m-col">
        <label class="m-label">Total Pages</label>
        <input class="m-input" id="fPages" type="number" placeholder="320" value="${b?.pages||''}">
      </div>
      <div class="m-col">
        <label class="m-label">Current Page</label>
        <input class="m-input" id="fCurrentPage" type="number" placeholder="0" value="${b?.currentPage||''}">
      </div>
    </div>
    <label class="m-label">Rating</label>
    <div class="stars">${stars}</div>
    <label class="m-label">Notes</label>
    <textarea class="m-input" id="fNotes" rows="4" placeholder="Passages, impressions, quotes…"
      style="resize:vertical;font-family:'Source Serif 4',Georgia,serif">${esc(b?.notes||'')}</textarea>
    <button class="save-btn" id="saveBtn" onclick="saveBook()"${!(b?.title||'').trim()?'':''}>Save Entry</button>`;
}

function selectStatus(s){
  formStatus=s;
  STATUSES.forEach(st=>{
    const pill=document.getElementById('pill_'+st.key); if(!pill) return;
    pill.style.border=s===st.key?`2px solid ${st.color}`:'1px solid #D8D0BC';
    pill.style.background=s===st.key?`${st.color}22`:'transparent';
  });
}

function setRating(n){
  formRating=n;
  document.querySelectorAll('.star-btn').forEach((btn,i)=>btn.classList.toggle('on',i<n));
}

function saveBook(){
  const title=document.getElementById('fTitle')?.value.trim(); if(!title) return;
  const book={
    id: editingBook?.id||uid(), title,
    author: document.getElementById('fAuthor')?.value.trim()||'',
    status: formStatus, rating: formRating,
    notes: document.getElementById('fNotes')?.value||'',
    pages: parseInt(document.getElementById('fPages')?.value)||null,
    currentPage: parseInt(document.getElementById('fCurrentPage')?.value)||0,
    addedAt: editingBook?.addedAt||new Date().toISOString(),
    finishedAt: formStatus==='finished'
      ?(editingBook?.finishedAt||new Date().toISOString()):null,
  };
  const idx=books.findIndex(b=>b.id===book.id);
  if(idx>=0) books[idx]=book; else books.push(book);
  persistBooks(); render(); closeModal();
}

function deleteBook(id){
  if(!confirm('Remove this book from your shelf?')) return;
  books=books.filter(b=>b.id!==id);
  persistBooks(); render(); closeModal();
}

// ═══════════════════════════════════════════
// KINDLE AUTOCOMPLETE
// ═══════════════════════════════════════════
function onAcInput(val){
  const q=val.trim().toLowerCase();
  const results=document.getElementById('kindleResults');
  if(!results) return;
  if(q.length<1){ results.classList.remove('show'); return; }
  const exact=KINDLE.find(b=>b.t.toLowerCase()===q);
  if(exact){ document.getElementById('fAuthor').value=exact.a; results.classList.remove('show'); return; }
  const matches=KINDLE.filter(b=>b.t.toLowerCase().includes(q)).slice(0,7);
  if(matches.length){
    _acResults=matches;
    results.innerHTML=matches.map((b,i)=>`
      <div class="ac-item" onmousedown="event.preventDefault()" onclick="pickAc(${i})">
        <div class="ac-item-title">${esc(b.t)}</div>
        <div class="ac-item-author">${esc(b.a)}</div>
      </div>`).join('');
    results.classList.add('show');
  } else {
    results.classList.remove('show');
  }
}

function pickAc(i){
  const b=_acResults[i]; if(!b) return;
  document.getElementById('fTitle').value=b.t;
  document.getElementById('fAuthor').value=b.a;
  document.getElementById('kindleResults')?.classList.remove('show');
  document.getElementById('fPages')?.focus();
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.ac-wrap'))
    document.getElementById('kindleResults')?.classList.remove('show');
});
</script>
