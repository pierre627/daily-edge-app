<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Learning Edge</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:#f1f5f9;padding:24px 16px 88px;font-family:'Source Serif 4',Georgia,serif;color:#1e293b}

/* ── Login ── */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;margin:-24px -16px 0;background:linear-gradient(160deg,#1a0a3c 0%,#4c1d95 55%,#1a0a2e 100%)}
.login-card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:40px 32px;text-align:center;max-width:320px;width:100%}
.login-icon{font-size:44px;margin-bottom:14px}
.login-title{font-size:22px;font-weight:600;color:#e9d5ff;margin-bottom:4px}
.login-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.4);margin-bottom:28px}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:none;border-radius:8px;padding:12px 24px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:#1e0a3c;cursor:pointer;width:100%;letter-spacing:.4px;text-transform:uppercase}
.btn-google img{width:18px;height:18px}

/* ── App shell ── */
#app{max-width:900px;margin:0 auto;display:none}
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.app-title{font-size:26px;font-weight:600;color:#7c3aed;letter-spacing:.2px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#d97706;opacity:0;transition:opacity .3s}
.sync-dot.show{opacity:1}
.sync-dot.offline{background:#ef4444;opacity:1}
.signout-btn{background:none;border:1px solid #e2e8f0;border-radius:6px;padding:4px 10px;font-size:11px;color:#94a3b8;cursor:pointer;font-family:'JetBrains Mono',monospace;letter-spacing:.3px}
.signout-btn:hover{border-color:#dc2626;color:#dc2626}
.app-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:#94a3b8;margin-bottom:18px;letter-spacing:.3px}

/* ── Bottom nav ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 2px 7px;gap:3px;border:none;background:none;color:#94a3b8;cursor:pointer;font-size:9px;font-weight:600;font-family:'JetBrains Mono',monospace;letter-spacing:.5px;text-transform:uppercase;transition:color .15s}
.nav-btn .nav-icon{font-size:20px}
.nav-btn.active{color:#7c3aed}

/* ── Tab panels ── */
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── Track cards ── */
.track-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.track-head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.track-emoji{font-size:34px;flex-shrink:0}
.track-info{flex:1;min-width:0}
.track-title{font-size:18px;font-weight:600;color:#1e293b;line-height:1.2}
.track-desc{font-size:12px;color:#94a3b8;margin-top:3px;line-height:1.4}
.track-pct{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:600;flex-shrink:0}
.track-bar-track{height:4px;background:#f1f5f9;border-radius:2px;margin-bottom:8px;overflow:hidden}
.track-bar-fill{height:4px;border-radius:2px;transition:width .5s ease}
.track-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:#94a3b8;margin-bottom:14px;letter-spacing:.3px}

/* ── Module rows ── */
.module-row{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px;overflow:hidden}
.module-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;-webkit-user-select:none;user-select:none}
.module-left{display:flex;align-items:center;gap:10px}
.module-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:#94a3b8;width:18px;flex-shrink:0}
.module-title-text{font-size:13px;font-weight:600;color:#334155}
.module-right{display:flex;align-items:center;gap:8px}
.module-badge{font-family:'JetBrains Mono',monospace;font-size:9px;color:#7c3aed;background:#ede9fe;border-radius:10px;padding:2px 8px;white-space:nowrap}
.module-arrow{font-size:12px;color:#94a3b8;transition:transform .2s;display:inline-block}
.module-arrow.open{transform:rotate(180deg)}
.module-lessons{display:none;border-top:1px solid #e2e8f0;background:#fff}
.module-lessons.open{display:block}

/* ── Lesson rows ── */
.lesson-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer;transition:background .1s}
.lesson-row:last-child{border-bottom:none}
.lesson-row:active,.lesson-row:hover{background:#f8fafc}
.lesson-status-icon{font-size:13px;flex-shrink:0;width:16px;text-align:center}
.lesson-text{flex:1;min-width:0}
.lesson-title-text{font-size:13px;color:#334155;line-height:1.3}
.lesson-title-text.done{color:#94a3b8;text-decoration:line-through}
.lesson-title-text.wip{color:#d97706}
.lesson-dur{font-family:'JetBrains Mono',monospace;font-size:9px;color:#94a3b8;flex-shrink:0}

/* ── Today panel ── */
.today-grid{display:grid;grid-template-columns:1fr 1px 1fr;gap:16px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
@media(max-width:420px){.today-grid{grid-template-columns:1fr;gap:12px}}
.today-divider{background:#e2e8f0}
@media(max-width:420px){.today-divider{display:none}}
.today-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#94a3b8;margin-bottom:8px}
.today-big{font-size:26px;font-weight:600;color:#d97706;line-height:1}
.today-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:#64748b;margin-top:4px;line-height:1.5}
.today-goal-link{background:none;border:none;color:#7c3aed;font-family:'JetBrains Mono',monospace;font-size:9px;cursor:pointer;padding:0;text-decoration:underline}
.goal-bar-track{height:4px;background:#f1f5f9;border-radius:2px;margin-top:8px;overflow:hidden}
.goal-bar-fill{height:4px;background:linear-gradient(90deg,#7c3aed,#d97706);border-radius:2px;transition:width .4s}
.log-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.log-btn{background:#f1f5f9;border:1px solid #e2e8f0;color:#334155;border-radius:6px;padding:5px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer}
.log-btn:active{background:#e2e8f0}
.streak-row{margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748b;display:flex;align-items:center;gap:5px}

.section-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#94a3b8;margin-bottom:8px}
.up-next-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.up-next-card:hover{border-color:#7c3aed}
.up-next-track-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.up-next-title{font-size:15px;font-weight:600;color:#1e293b;margin-bottom:3px}
.up-next-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:#94a3b8}
.start-btn{background:#7c3aed;color:#fff;border:none;border-radius:6px;padding:8px 18px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;margin-top:12px}
.all-done{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px;text-align:center;color:#94a3b8;font-style:italic;font-size:14px;margin-bottom:16px}

/* ── Progress panel ── */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.stat-num{font-size:28px;font-weight:600;color:#d97706;line-height:1}
.stat-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:#94a3b8;margin-top:4px}
.prog-track-row{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.prog-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.prog-name{font-size:14px;font-weight:600;color:#1e293b}
.prog-pct{font-family:'JetBrains Mono',monospace;font-size:12px;color:#d97706}
.prog-bar-track{height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden;margin-bottom:6px}
.prog-bar-fill{height:6px;border-radius:3px;transition:width .5s}
.prog-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:#94a3b8}
.activity-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.month-bars{display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:10px}
.m-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.m-bar-fill{width:100%;background:#7c3aed;border-radius:2px 2px 0 0;min-height:2px}
.m-bar-lbl{font-family:'JetBrains Mono',monospace;font-size:7px;color:#94a3b8}

/* ── Notes panel ── */
.notes-pad-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.notes-pad-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.notes-pad-title{font-size:15px;font-weight:600;color:#1e293b}
.notes-saved-indicator{font-family:'JetBrains Mono',monospace;font-size:9px;color:#22c55e;opacity:0;transition:opacity .4s}
.notes-pad-textarea{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;color:#334155;font-size:14px;font-family:'Source Serif 4',Georgia,serif;outline:none;resize:vertical;line-height:1.7;min-height:140px}
.notes-pad-textarea:focus{border-color:#7c3aed;background:#fff}
.notes-pad-textarea::placeholder{color:#94a3b8}

.lesson-note-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.lesson-note-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;gap:8px}
.lesson-note-title{font-size:13px;font-weight:600;color:#1e293b;line-height:1.3}
.lesson-note-track{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 7px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.lesson-note-body{font-size:13px;color:#475569;line-height:1.7;white-space:pre-wrap}
.notes-empty{text-align:center;color:#94a3b8;font-style:italic;font-size:14px;padding:32px 0}

/* ── Modal ── */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
.modal-wrap{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:22px 20px;width:100%;max-width:440px;color:#1e293b;box-shadow:0 16px 48px rgba(0,0,0,.15);max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-close{float:right;background:none;border:none;color:#94a3b8;font-size:26px;cursor:pointer;line-height:1;padding:0;margin-left:10px}
.modal-track-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
.modal-lesson-title{font-size:18px;font-weight:600;color:#1e293b;line-height:1.3;margin-bottom:8px;padding-right:30px}
.modal-desc{font-size:13px;color:#64748b;line-height:1.6;margin-bottom:16px;font-style:italic}
.m-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#64748b;margin-bottom:6px;display:block}
.status-pills{display:flex;gap:8px;margin-bottom:16px}
.s-pill{flex:1;padding:8px 4px;border-radius:6px;background:transparent;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.3px;text-transform:uppercase;cursor:pointer;color:#64748b;border:1px solid #e2e8f0;transition:all .15s;white-space:nowrap}
.m-textarea{width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:6px;background:#f8fafc;color:#334155;font-size:14px;font-family:'Source Serif 4',Georgia,serif;outline:none;resize:vertical;margin-bottom:14px;line-height:1.7}
.m-textarea:focus{border-color:#7c3aed;background:#fff}
.m-textarea::placeholder{color:#94a3b8}
.modal-log-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.modal-log-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:#64748b;flex-shrink:0}
.modal-log-btn{background:#f1f5f9;border:1px solid #e2e8f0;color:#334155;border-radius:6px;padding:5px 12px;font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer}
.modal-log-btn:active{background:#e2e8f0}
.modal-time-logged{font-family:'JetBrains Mono',monospace;font-size:10px;color:#d97706}
.save-btn{width:100%;padding:11px 0;background:#7c3aed;color:#fff;border:none;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.6px;text-transform:uppercase;cursor:pointer}

/* ── Lesson content ── */
.m-lesson-content{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px 16px;margin-bottom:16px;font-size:13px;color:#334155;line-height:1.75}
.m-lesson-content h4{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#7c3aed;margin:14px 0 5px}
.m-lesson-content h4:first-child{margin-top:0}
.m-lesson-content .ex{background:#ede9fe;border-left:3px solid #7c3aed;border-radius:0 6px 6px 0;padding:8px 12px;margin:8px 0;font-family:'JetBrains Mono',monospace;font-size:11px;color:#4c1d95;line-height:1.6}
.m-lesson-content .rule{display:block;background:#fef3c7;border-left:3px solid #d97706;border-radius:0 6px 6px 0;padding:7px 12px;margin:8px 0;font-size:12px;font-weight:600;color:#92400e}
.m-lesson-content ul{padding-left:18px;margin:4px 0}
.m-lesson-content li{margin:4px 0}
.m-lesson-content strong{color:#1e293b}

.m-lesson-content .check strong{color:#166534}

/* ── Interactive Quiz ─────────────────────── */
.m-lesson-content .check{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px 14px;margin-top:14px;font-size:12px;color:#166534}
.quiz-q{margin-bottom:8px;line-height:1.6}
.quiz-input{width:100%;box-sizing:border-box;min-height:72px;border:1px solid #bbf7d0;border-radius:6px;padding:8px 10px;font-size:12px;font-family:'Source Serif 4',Georgia,serif;resize:vertical;background:#fff;color:#1e293b;margin:4px 0 8px;line-height:1.5}
.quiz-input:focus{outline:none;border-color:#16a34a;box-shadow:0 0 0 2px #bbf7d044}
.quiz-reveal-btn{background:#16a34a;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.3px}
.quiz-reveal-btn:hover{background:#15803d}
.quiz-reveal{margin-top:10px}
.quiz-answer-box{background:#fff;border:1px solid #bbf7d0;border-radius:6px;padding:10px 12px;font-size:12px;line-height:1.7;color:#166534;margin-bottom:8px}
.quiz-self-check{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.quiz-sc-lbl{font-size:11px;color:#374151;font-weight:600}
.quiz-got-btn{background:#16a34a;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer}
.quiz-miss-btn{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer}
.quiz-result-label{font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px}
.quiz-result-label.got{background:#dcfce7;color:#16a34a}
.quiz-result-label.missed{background:#fee2e2;color:#dc2626}
</style>
</head>

<!-- ═══ LOGIN ═══ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-icon">🎓</div>
    <div class="login-title">The Learning Edge</div>
    <div class="login-sub">Photography · Revenue Basics</div>
    <button class="btn-google" onclick="signIn()">
      <img src="https://www.google.com/favicon.ico" alt="">Sign in with Google
    </button>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app">
  <div class="app-header">
    <h1 class="app-title">The Learning Edge</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="sync-dot" id="syncDot"></div>
      <button class="signout-btn" onclick="signOut()">Sign out</button>
    </div>
  </div>
  <div class="app-sub" id="appSub">Loading…</div>

  <!-- Tab panels -->
  <div class="tab-panel active" id="panel-tracks">
    <div id="tracksContent"></div>
  </div>

  <div class="tab-panel" id="panel-today">
    <div id="todayContent"></div>
  </div>

  <div class="tab-panel" id="panel-progress">
    <div id="progressContent"></div>
  </div>

  <div class="tab-panel" id="panel-notes">
    <div id="notesContent"></div>
  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-tracks" onclick="switchTab('tracks')">
      <span class="nav-icon">📚</span>Tracks
    </button>
    <button class="nav-btn" id="nav-today" onclick="switchTab('today')">
      <span class="nav-icon">📅</span>Today
    </button>
    <button class="nav-btn" id="nav-progress" onclick="switchTab('progress')">
      <span class="nav-icon">📊</span>Progress
    </button>
    <button class="nav-btn" id="nav-notes" onclick="switchTab('notes')">
      <span class="nav-icon">📝</span>Notes
    </button>
  </div>
</div>

<!-- ═══ MODAL ═══ -->
<div id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-wrap" id="modalCard"></div>
</div>

  {
    id:'photography', title:'Photography', emoji:'📷', accent:'#7c3aed', accentBg:'#ede9fe',
    desc:'Fundamentals, Fujifilm X-E5, street photography, and landscape mastery',
    modules:[
      { id:'ph-m1', title:'Photography Fundamentals', lessons:[
        {id:'ph-l1', title:'The Exposure Triangle', desc:'Aperture, shutter speed, and ISO work together to create every image. Change one and you must compensate with another.', min:45,
         content:`<h4>The Three Variables</h4>
<strong>Aperture (f-stop)</strong> — Controls how wide the lens opens. Measured in f-stops.<br>
<ul>
<li>Wide aperture (f/1.8): More light in, shallow depth of field (blurry background)</li>
<li>Narrow aperture (f/16): Less light in, deep depth of field (everything sharp)</li>
<li>Counter-intuitive: <em>lower</em> f-number = <em>wider</em> opening</li>

<strong>Shutter Speed</strong> — How long the sensor is exposed to light.<br>

<li>Fast (1/1000s): Freezes motion. Less light.</li>

</ul>
<strong>ISO</strong> — Sensor sensitivity to light.<br>
<ul>
<li>Low ISO (100–400): Clean image, less sensitivity</li>
<li>High ISO (3200+): Brighter in dark conditions, but adds grain/noise</li>
</ul>
<h4>The Relationship</h4>
<div class="ex">You're shooting indoors. It's dark. You can:<br>
(a) Open aperture wider → shallower focus<br>
(b) Slow shutter speed → risk camera shake<br>
(c) Raise ISO → introduce grain<br>
Most situations require balancing all three.</div>
<h4>Stop Increments</h4>
Doubling or halving any variable = one "stop" of light. Going from f/2.8 to f/4 halves the light. Going from 1/125 to 1/250 halves the light. One stop is one stop — they're interchangeable in terms of exposure.
<span class="rule">Rule: Expose for the subject. Then decide which variable's side effect you can live with (blur, grain, or depth of field).</span>
<div class="check"><div class="quiz-q"><strong>Quiz:</strong> You're shooting a moving dog at f/2.8, 1/60s, ISO 400. The image is blurry. What's the most likely fix — and what trade-off does it create?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answer: Increase shutter speed to 1/500s or faster to freeze motion. To maintain exposure, either open aperture (if possible) or raise ISO.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>
<div class="check"><strong>Project:</strong> Find a static subject. Shoot it three times with identical exposure (same brightness) using three different combinations of aperture, shutter, and ISO. Notice how the look changes even when the exposure is the same.</div>`
        },
        {id:'ph-l2', title:'Camera Modes Explained', desc:'When to use Manual, Aperture Priority, Shutter Priority, and Program — and why the mode matters less than the habit.', min:30,
         content:`<h4>The Four Main Modes</h4>
<strong>Manual (M)</strong> — You set aperture, shutter, and ISO. Full control, full responsibility. Best when: light is consistent and you know exactly what you want.
<br><br>
<strong>Aperture Priority (A or Av)</strong> — You set aperture and ISO, camera chooses shutter. Best when: depth of field matters most (portraits, street, architecture). Most-used mode among experienced photographers.
<br><br>
<strong>Shutter Priority (S or Tv)</strong> — You set shutter and ISO, camera chooses aperture. Best when: freezing or blurring motion is the priority (sports, waterfalls, cars).
<br><br>
<strong>Program (P)</strong> — Camera chooses both aperture and shutter. You can shift the pair. Best when: you want a starting point in unfamiliar light and can adjust from there.
<h4>For Fujifilm X-E5</h4>
The X-E5 has physical aperture rings on lenses and a shutter speed dial on top. When you set the aperture ring to "A" and the shutter to "A," you're in Program. Set one to a value and the other to "A" for semi-auto modes.
<div class="ex">Aperture ring on f/2.0, shutter dial on A → Aperture Priority<br>
Aperture ring on A, shutter dial on 1/500 → Shutter Priority<br>
Both on specific values → Manual</div>
<span class="rule">Start with Aperture Priority. It gives you control over the most impactful variable (depth of field) while handling the rest automatically. Switch to Manual when you need to lock everything down.</span>
<div class="check"><div class="quiz-q"><strong>Quiz:</strong> You're shooting a fountain and want the water to look silky smooth. Which mode and approximate shutter speed would you choose?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answer: Shutter Priority at 1/4s to 1s. Use a tripod. Lower ISO to avoid overexposure with the slow shutter.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>
<div class="check"><strong>Project:</strong> Shoot the same scene 4 times — once in each mode — and compare how the camera handles changing light. Notice when the camera's automatic choices match what you wanted and when they don't.</div>`
        },
        {id:'ph-l3', title:'Autofocus Systems & Fujifilm AF', desc:'Understanding AF modes means your camera hits focus when and where you need it. Missing focus is almost always a mode choice, not a camera limitation.', min:30,
         content:`<h4>AF Modes (When to Lock Focus)</h4>
<strong>AF-S (Single)</strong> — Locks focus when you half-press the shutter. Use for static subjects. This is the default and most reliable mode.
<br><br>
<strong>AF-C (Continuous)</strong> — Tracks a moving subject as long as you hold the shutter half-pressed. Use for moving subjects (people walking, bikes, birds).
<br><br>
<strong>MF (Manual Focus)</strong> — You focus manually using the lens ring. Use for macro, astrophotography, or when AF can't find the target.
<h4>AF Zone Modes (Where to Focus)</h4>
<ul>
<li><strong>Single point:</strong> You choose exactly where the camera focuses. Most precise.</li>
<li><strong>Zone:</strong> A cluster of AF points. Good for moving subjects you can roughly predict.</li>
<li><strong>Wide/All:</strong> Camera chooses. Fast and convenient, but can lock onto the wrong subject.</li>
</ul>
<h4>Fujifilm X-E5 Specifics</h4>
<ul>
<li>Face/Eye Detection AF works excellently for people — turn it on when shooting portraits or street</li>
<li>Subject tracking: Select a subject and the camera follows it across the frame</li>
<li>Pre-AF: Camera continuously focuses even when you're not pressing the shutter — helps in AF-C</li>
</ul>
<span class="rule">For street photography: AF-S + single point, placed on the subject's eye. For moving subjects: AF-C + zone. For landscapes: MF or AF-S at the hyperfocal distance.</span>
<div class="check"><div class="quiz-q"><strong>Quiz:</strong> You're shooting a child running toward you. Which AF mode and zone setting should you use?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answer: AF-C (continuous), Zone mode or wide with subject tracking. Enable face/eye detection if available.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>
<div class="check"><strong>Project:</strong> Photograph a moving subject (a person walking, a car passing) using AF-S vs. AF-C. Compare hit rate and observe when continuous tracking is worth it.</div>`
        },
        {id:'ph-l4', title:'White Balance & Color Temperature', desc:'White balance controls the warmth or coolness of your image. Shooting in the right white balance avoids hours of correction in post.', min:25,
         content:`<h4>What Is White Balance?</h4>
Different light sources emit different colors of light. Daylight is blue-white. Tungsten is orange. Fluorescent is green-tinted. White balance tells the camera (or your edit software) what "white" looks like in that light, so it can correct everything else.
<h4>Color Temperature Scale</h4>
<div class="ex">2000K — Candlelight (very warm, orange)<br>
3200K — Tungsten/incandescent bulbs<br>
5500K — Daylight (neutral)<br>
6500K — Overcast sky (slightly cool, blue)<br>
10000K — Clear blue sky (very cool)</div>
<h4>Presets on the X-E5</h4>
<ul>
<li><strong>Auto (AWB):</strong> Camera guesses. Usually good, but can shift between shots in mixed light.</li>
<li><strong>Daylight/Sunny:</strong> Accurate for direct sunlight at midday</li>
<li><strong>Shade:</strong> Warms up the image to compensate for blue shadow light</li>
<li><strong>Cloudy:</strong> Slight warming</li>
<li><strong>Fluorescent / Tungsten:</strong> Corrects artificial light sources</li>
<li><strong>Custom (Kelvin):</strong> Set a specific temperature value — most consistent option</li>
</ul>
<h4>Fujifilm Tip</h4>
Fujifilm's film simulations (especially Velvia and Classic Chrome) interact with white balance. A warmer WB on Velvia intensifies the effect. Experiment with WB as a creative tool, not just a correction.
<span class="rule">If shooting RAW, white balance can be changed in post without quality loss. If shooting JPEG (common on X-E5 for Fuji colors), get it right in camera.</span>
<div class="check"><div class="quiz-q"><strong>Quiz:</strong> You're shooting indoors under warm tungsten light. Your images look very orange. What WB preset should you try?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answer: Tungsten/Incandescent preset, or set Kelvin manually to ~3200K.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>
<div class="check"><strong>Project:</strong> Photograph the same scene at three different white balance settings (Auto, Daylight, Shade). Notice how the mood shifts even though the subject is identical.</div>`
        },
      ]},
      { id:'ph-m2', title:'Fujifilm X-E5 Mastery', lessons:[
        {id:'ph-l5', title:'Film Simulations — Fuji\'s Secret Weapon', desc:'Fujifilm\'s film simulations are the main reason people buy X-series cameras. Learn what each does and when to use it.', min:40,
         content:`<h4>Why Film Simulations Matter</h4>
Fujifilm engineers recreated the look of classic film stocks inside the camera's processing engine. Unlike generic "filters," these are scientifically modeled color science that produce camera-ready JPEGs worth keeping.
<h4>The Key Simulations</h4>
<strong>Provia/Standard</strong> — Balanced, neutral. Good starting point. Use when you're unsure.
<br><br>
<strong>Velvia</strong> — High contrast, saturated, vivid colors. Colors pop aggressively. Iconic for landscapes with greens, blues, and reds. Can be too much for skin tones.
<br><br>
<strong>Astia/Soft</strong> — Gentle contrast, soft skin tones, slightly warm. Best for portraits and people.
<br><br>
<strong>Classic Chrome</strong> — Muted, desaturated, faded highlights. Cinematic, documentary feel. Excellent for street photography. One of the most popular simulations.
<br><br>
<strong>Classic Neg</strong> — Even more muted than Classic Chrome. Shadows lift slightly. Film-negative aesthetic. Street and travel.
<br><br>
<strong>Eterna/Cinema</strong> — Very flat, desaturated, low contrast. Designed for video but creates a cool, editorial look in stills.
<br><br>
<strong>Acros</strong> — Fuji's black-and-white simulation. Rich tonal range, sharp grain. Far better than desaturating in post. Shoot in Acros and see the world in black and white.
<h4>Customizing Simulations</h4>
Each simulation can be adjusted: Highlight, Shadow, Color, Sharpness, Noise Reduction, Grain. Small adjustments make big differences. Save up to 7 custom recipes as C1–C7.
<span class="rule">Don't just pick a simulation — customize it. A slightly reduced highlight, +1 shadow, and grain at medium-strong transforms Classic Chrome into a signature look.</span>
<div class="check"><div class="quiz-q"><strong>Quiz:</strong> You're shooting golden hour in a forest. Which simulation would emphasize the warm greens and golden light most intensely?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answer: Velvia. It saturates greens and warms reds/yellows aggressively. Be careful — it can clip highlights. Reduce Highlight tone to -1.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>
<div class="check"><strong>Project:</strong> Shoot one scene in 5 different film simulations without changing any other settings. Export all 5. Pick your favorite and identify what it is about the color rendering that appeals to you.</div>`
        },
        {id:'ph-l6', title:'Physical Controls and the X-E5 Layout', desc:'The X-E5 is designed to be operated by feel, not menus. Understanding the physical controls makes you faster and more present while shooting.', min:30,
         content:`<h4>The X-E5 Control Philosophy</h4>
Fujifilm designed the X-series to feel like a classic rangefinder. The goal is to change settings without taking your eye from the viewfinder — or your mind from the scene.
<h4>Key Controls</h4>
<strong>Shutter Speed Dial (top right)</strong> — Physical dial from T (time) through 1/8000s. "A" position enables auto shutter. Pull up and rotate for ISO.
<br><br>
<strong>Aperture Ring (on lens)</strong> — Rotate to set aperture. "A" position enables auto aperture. This is why Fuji lenses feel different — the aperture is <em>on the lens</em>, not in a body dial.
<br><br>
<strong>Exposure Compensation Dial (top left)</strong> — ±3 stops in 1/3 increments. The most-used dial on any X-series camera. Get comfortable reaching for it without looking.
<br><br>
<strong>Command Dial (rear)</strong> — In Manual mode, controls ISO. In other modes, controls the non-automatic variable.
<br><br>
<strong>Focus Lever (rear right)</strong> — Moves the AF point around the frame in real time. Faster than touchscreen in most situations.
<h4>Custom Buttons (Q button and Fn buttons)</h4>
Program the Q menu and Fn buttons for your most-used settings. Recommended: Film Simulation, White Balance, AF Mode, Self-Timer, and ND Filter (if built-in).
<span class="rule">Learn to set aperture, shutter, and exposure compensation without looking at the camera. That muscle memory is what separates a photographer who reacts from one who misses the shot.</span>
<div class="check"><strong>Project:</strong> Practice the "blind drill" — with the camera off, close your eyes and set a specific exposure (e.g., f/2.8, 1/500, +0.7EV) using only the physical controls. Repeat until it takes under 5 seconds.</div>`
        },
        {id:'ph-l7', title:'JPEG vs. RAW on the X-E5', desc:'The X-E5\'s JPEGs are exceptional. Understanding when to shoot each format changes your entire workflow.', min:25,
         content:`<h4>The Core Difference</h4>
<strong>RAW</strong> — Unprocessed sensor data. Maximum flexibility in post. White balance, exposure, and color can be changed non-destructively. File is large (~25-40MB). Requires editing software.
<br><br>
<strong>JPEG</strong> — Camera-processed image. Film simulation, white balance, and tone curves are baked in. Smaller file (~8-15MB). Ready to share immediately. Less editing latitude.
<h4>Why Fujifilm JPEGs Are Different</h4>
Most camera manufacturers' JPEGs are generic. Fujifilm JPEGs are the film simulations — and they're good enough that many professionals shoot JPEG-only on X-series. The color science is the product.
<h4>When to Shoot RAW</h4>
<ul>
<li>Challenging exposure situations (very dark, very bright, mixed light)</li>
<li>When you want to change the film simulation/color look later</li>
<li>Commercial or paid work where the client needs maximum flexibility</li>
</ul>
<h4>When to Shoot JPEG</h4>
<ul>
<li>Street photography — fast, light, camera-ready files</li>
<li>Travel — when you've dialed in your film recipe</li>
<li>When you trust your in-camera settings and want to minimize post-processing</li>
</ul>
<h4>RAW+JPEG</h4>
Shoot both simultaneously. More storage, but you get the JPEG for quick review/sharing and the RAW as insurance.
<span class="rule">If you've spent time dialing in your film simulation recipe, shoot JPEG. The point of the X-E5 is beautiful out-of-camera files. Don't negate that by always shooting RAW.</span>
<div class="check"><div class="quiz-q"><strong>Quiz:</strong> You're shooting a documentary project on the street. Light is variable — sometimes harsh sun, sometimes deep shade. RAW, JPEG, or both — and why?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answer: RAW or RAW+JPEG. Variable, unpredictable light means you may need to recover exposure or shift white balance. Having the RAW gives you that option.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'ph-l8', title:'Custom Recipes and In-Camera JPEG Workflow', desc:'Building a personal recipe library turns the X-E5 into a camera that produces your look straight from the card.', min:35,
         content:`<h4>What a Recipe Is</h4>
A recipe is a saved combination of: Film Simulation + White Balance + Highlight Tone + Shadow Tone + Color + Sharpness + Noise Reduction + Grain. The X-E5 stores up to 7 as C1–C7 on the drive dial.
<h4>Building Your First Recipe</h4>
Start with Classic Chrome as the base:
<div class="ex">Film Simulation: Classic Chrome<br>
White Balance: Daylight (5500K) or Shade for warmth<br>
Highlight Tone: -1 (protect highlights)<br>
Shadow Tone: 0 or +1 (lift shadows slightly for film feel)<br>
Color: -1 or -2 (mute the saturation for that faded film look)<br>
Sharpness: 0 or -1<br>
Noise Reduction: -4 (Fuji's NR is heavy — pull it back)<br>
Grain: Medium-Strong, Small</div>
<h4>Recipe Resources</h4>
Fuji X Weekly (fujixweekly.com) is the best free library of user-created recipes. Hundreds of recipes with before/after examples, searchable by film simulation.
<h4>The Workflow</h4>
<ol style="padding-left:18px;margin:6px 0">
<li>Dial in 3–5 recipes for your most common shooting situations</li>
<li>Assign each to C1–C5 on the drive dial</li>
<li>Before a shoot, select the recipe for that type of light and subject</li>
<li>Shoot JPEG. Review on the back of the camera. Adjust recipe if needed.</li>
<li>Import to phone/computer for final select and minimal editing</li>
</ol>
<span class="rule">A recipe is a commitment to a visual identity. The best photographers aren't trying every simulation every day — they've found 2–3 looks and they own them.</span>
<div class="check"><strong>Project:</strong> Create your first custom recipe. Shoot 20 images with it in one day. Don't touch it for a week. Come back and evaluate: does this look represent who you want to be as a photographer?</div>`
        },
      ]},
      { id:'ph-m3', title:'Street Photography', lessons:[
        {id:'ph-l9', title:'The Mindset and Ethics of Street Photography', desc:'Great street photography begins before you pick up the camera. The approach, the intention, and how you treat people determines everything else.', min:30,
         content:`<h4>What Street Photography Is</h4>
Street photography is the candid documentation of public life — human moments, interaction, emotion, and environment in uncontrolled settings. It is not about sneaking photos of strangers. It is about being present and perceptive.
<h4>The Legal Basics</h4>
<ul>
<li>In most countries, photographing people in public spaces is legal</li>
<li>Publishing images commercially requires a model release</li>
<li>Some countries (Germany, France) have stricter personality rights — know your local laws</li>
<li>"No photography" signs on private property (shopping malls, train stations that are private) should be respected</li>
</ul>
<h4>The Ethics</h4>
Legality and ethics aren't the same thing. Ask yourself:
<ul>
<li>Would I be comfortable showing this person the photo?</li>
<li>Am I capturing their dignity or exploiting their vulnerability?</li>
<li>Is this photo about them, or about my curiosity at their expense?</li>
</ul>
<h4>The Approach</h4>
<strong>Be present, not predatory.</strong> Walk slowly. Make eye contact. Smile. Most people who notice you being photographed don't mind if you carry yourself with warmth. If someone objects, lower your camera and move on. Never argue.
<h4>The Mindset Shift</h4>
The most common mistake: thinking you need permission to be in public with a camera. The second most common: hesitating at the decisive moment. Hesitation costs you the shot and gains you nothing.
<span class="rule">The best street photographers are invisible because they're comfortable, not because they're hiding. Comfort comes from knowing your camera, your settings, and why you're there.</span>
<div class="check"><strong>Project:</strong> Spend 1 hour on a busy street with your camera. Don't take a single photo. Just observe — light, movement, expressions, moments. Then go back the next day and shoot.</div>`
        },
        {id:'ph-l10', title:'Street Settings and the X-E5 for Street', desc:'Street photography punishes hesitation. The right settings let you react in a fraction of a second without thinking about the camera.', min:30,
         content:`<h4>The Street Settings Formula</h4>
Street photography has one enemy: missed focus and motion blur at the wrong moment. Set up to eliminate both.
<div class="ex">Aperture: f/5.6 – f/8 (deep depth of field — more of the scene is in focus)<br>
Shutter: 1/500s or faster (freezes motion and camera shake)<br>
ISO: Auto, max 6400 (let the camera handle exposure)<br>
AF Mode: AF-S with Face Detection, or zone AF<br>
AF Point: Center or small zone</div>
<h4>Zone Focusing</h4>
Set your lens to f/8, focus to ~3 meters, and at that aperture everything from ~2m to 5m is in focus. You don't need to focus at all — just compose and shoot. This is how street photography was done for decades with manual focus cameras.
<h4>Fujifilm X-E5 Street Setup</h4>
<ul>
<li>Film Simulation: Classic Chrome or Classic Neg for the documentary feel</li>
<li>Set exposure compensation dial to -1/3 to -2/3 for slightly moody exposure</li>
<li>Silent shutter / electronic shutter: reduces camera noise for discreet shooting</li>
<li>Shoot from the hip: practice framing without raising the camera for candid moments</li>
</ul>
<h4>Lens Choice</h4>
The 23mm f/2 (35mm equivalent) is the classic street lens on Fuji. It's wide enough to include context, fast enough for low light, and small enough to be unintimidating. The 35mm f/2 (50mm equivalent) is more intimate.
<span class="rule">Preset everything. The best street shot is the one you didn't have to think about technically. Your job in the moment is seeing — the camera should handle everything else.</span>
<div class="check"><strong>Project:</strong> Shoot a 1-hour "street session" using only zone focusing at f/8, 3m. No chimping (checking the screen). Shoot 50+ frames and review only at home. Notice how your shooting changes when you're not checking results.</div>`
        },
        {id:'ph-l11', title:'Composition on the Street', desc:'Composition in street photography happens in split seconds. Training your eye to see geometry, layers, and light means your instincts do the work.', min:35,
         content:`<h4>Key Compositional Principles for Street</h4>
<strong>Background first</strong> — Find an interesting background (a mural, a shadow pattern, a shaft of light) and wait for a subject to enter it. This is how many of the iconic street shots work.
<br><br>
<strong>Leading lines</strong> — Streets, alleys, fences, and staircases lead the eye. Position yourself so lines converge toward your subject.
<br><br>
<strong>Layers</strong> — Foreground, midground, background. A strong street photo often has all three telling different stories simultaneously.
<br><br>
<strong>Shadow and light</strong> — Harsh midday light creates dramatic shadows that become compositional elements. Pools of light in dark doorways, long shadows stretching across pavement.
<br><br>
<strong>The decisive moment</strong> — Henri Cartier-Bresson's principle: the instant when form, content, and geometry align. You can't plan it, but you can position yourself where it's most likely to happen.
<h4>The Frame Within a Frame</h4>
Use doorways, windows, arches, and gaps to frame your subject. It creates depth and context simultaneously.
<h4>Black and White Street</h4>
Shoot in Acros. Color can distract from the emotional content of a street image. Black and white emphasizes form, texture, light, and expression — the things that make street photographs last.
<span class="rule">Composition on the street is 90% positioning and 10% timing. Get yourself to the right place — the moment will come to you.</span>
<div class="check"><strong>Project:</strong> Spend a session shooting only in black and white (Acros simulation). Look only for light, shadow, and geometry — deliberately ignore color subjects. Review and identify your 3 strongest frames.</div>`
        },
        {id:'ph-l12', title:'Editing Street Photography', desc:'The edit is where street photography gets its final voice. Less is almost always more — the best street photos need minimal intervention.', min:25,
         content:`<h4>The Street Editing Philosophy</h4>
Street photography's power comes from authenticity. Heavy editing undermines that. The goal is to enhance what was already there — not manufacture a mood that wasn't.
<h4>The Minimal Edit Workflow</h4>
<ol style="padding-left:18px;margin:6px 0">
<li><strong>Cull ruthlessly</strong> — shoot 100, keep 5. The selection is the edit.</li>
<li><strong>Exposure:</strong> Slight lift or lower to taste. Protect highlights, retain shadow detail.</li>
<li><strong>Contrast:</strong> Medium-high for black and white. Moderate for color.</li>
<li><strong>Clarity/Texture:</strong> Small positive value adds grit and texture — suits the street aesthetic</li>
<li><strong>Crop:</strong> Only if the composition genuinely improves. Never crop to fix a bad frame.</li>
</ol>
<h4>Color Grading for Street</h4>
Classic Chrome from the X-E5 already does most of the work. If editing in Lightroom:
<div class="ex">Fade the highlights (pull whites down slightly)<br>
Lift the blacks slightly (like a faded film print)<br>
Desaturate slightly or pull specific colors (oranges/reds for skin)<br>
Add a slight warm split tone in shadows</div>
<h4>When to Convert to Black and White</h4>
Convert if: the color is distracting, the light and shadow contrast is strong, the emotion is in the expression rather than the environment.
<span class="rule">The best street editors can describe in one sentence what the photo is about — and then they delete anything in the edit that doesn't serve that sentence.</span>
<div class="check"><strong>Project:</strong> From your last street session, cull down to 10 images. Edit them with a maximum of 5 slider adjustments each. Export and post your top 3 somewhere — a private folder, a journal, or Instagram.</div>`
        },
      ]},
      { id:'ph-m4', title:'Landscape Photography', lessons:[
        {id:'ph-l13', title:'Planning a Landscape Shoot', desc:'The best landscape photographs are planned, not stumbled upon. Light, location, and weather research separate deliberate work from luck.', min:35,
         content:`<h4>The Planning Stack</h4>
<strong>Location scouting</strong> — Google Maps satellite view, Instagram geotags, and apps like The Photographer's Ephemeris (TPE) or PhotoPills show you what a location looks like and when the light will be ideal.
<br><br>
<strong>Golden and blue hour timing</strong> — The sun rises and sets at a different angle every day of the year. TPE and PhotoPills show you exactly where the sun will rise/set on your chosen date, at your chosen location, and how the light will fall on your subject.
<br><br>
<strong>Weather</strong> — Clear skies are boring for landscapes. Dramatic clouds, fog, mist, and post-storm light create atmosphere. Apps: Windy, Clear Outside, Weather Underground for detailed conditions.
<br><br>
<strong>Tide charts</strong> — For coastal work, tide timing affects what's accessible and what reflections/patterns appear.
<h4>Tools</h4>
<ul>
<li><strong>PhotoPills:</strong> Sun/moon position, AR overlay on your camera view, milky way planner</li>
<li><strong>The Photographer's Ephemeris (TPE):</strong> Map-based sun/moon direction tool</li>
<li><strong>Windy.com:</strong> Wind, cloud cover, precipitation forecasting</li>
</ul>
<h4>Arrive Early</h4>
For golden hour, arrive 30–45 minutes before sunrise. The light changes rapidly — you want to be set up, composed, and ready before it happens.
<span class="rule">Spending 2 hours planning a shoot saves 4 hours of shooting in bad light and produces better work than spontaneous trips. The image is made before you pick up the camera.</span>
<div class="check"><strong>Project:</strong> Use PhotoPills or TPE to plan a specific sunrise shoot at a location within 30 minutes of home. Identify: exact sunrise time, sun direction, your composition position. Execute the shoot within the next 2 weeks.</div>`
        },
        {id:'ph-l14', title:'Exposure for Landscapes', desc:'Landscape exposure requires different thinking than other genres. The goal is to capture the full dynamic range of light — from the brightest sky to the darkest shadow.', min:35,
         content:`<h4>The Challenge</h4>
A landscape scene at golden hour can have 10–14 stops of dynamic range (sky vs. shadows). Camera sensors capture 12–15 stops at most. You must make choices.
<h4>Expose to the Right (ETTR)</h4>
<div class="ex">Set your exposure so highlights are as bright as possible without blowing out. The histogram should push toward the right without clipping. Then recover shadow detail in post.</div>
This maximizes data captured and minimizes shadow noise.
<h4>The Histogram</h4>
Don't judge exposure by the image on the screen — the display brightness varies. Use the histogram:
<ul>
<li>Spike touching the right wall = blown highlights (unrecoverable)</li>
<li>Spike touching the left wall = crushed blacks (recoverable in RAW)</li>
<li>Ideal: data spread across the full range, not touching either wall</li>
</ul>
<h4>Long Exposures</h4>
For smooth water and cloud movement, use shutter speeds of 0.5s–30s. Requirements:
<ul>
<li>Tripod (essential)</li>
<li>Remote shutter release or 2-second timer (prevents camera shake at trigger)</li>
<li>ND filter to reduce light and allow long exposures in daylight (see next lesson)</li>
<li>Aperture: f/8–f/11 for maximum sharpness across the frame</li>
</ul>
<h4>Fujifilm X-E5 for Landscapes</h4>
Shoot RAW for maximum dynamic range flexibility. Velvia works beautifully for landscapes with strong colors — but be careful with clipped highlights. Use highlight tone -1 or -2.
<span class="rule">Landscape exposure is about information preservation. Get the full range onto the sensor. Decide the mood in post.</span>
<div class="check"><div class="quiz-q"><strong>Quiz:</strong> Your landscape histogram shows data clustered in the left half with nothing on the right. What does this mean and how do you fix it?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answer: Underexposed — shadows will be noisy and detail is lost. Increase exposure until the histogram moves right without clipping highlights.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'ph-l15', title:'Composition in Landscapes', desc:'Landscape composition creates depth, scale, and emotional resonance. Without it, a beautiful scene becomes a flat photograph.', min:35,
         content:`<h4>The Fundamental Challenge</h4>
Landscape photography translates a 3D, 360-degree sensory experience into a flat rectangle. Composition is how you create the illusion of depth and draw the viewer into the scene.
<h4>Foreground, Midground, Background</h4>
The most powerful landscape compositions have three layers:
<div class="ex">Foreground: rocks, flowers, reflections, sand patterns → anchors the image<br>
Midground: the main subject (mountain, tree, building)<br>
Background: sky, distant hills, clouds → provides scale and context</div>
Get low. A low angle exaggerates the foreground and creates depth.
<h4>Leading Lines</h4>
Roads, rivers, fences, shorelines, and rows of trees lead the eye through the frame. Place them diagonally for dynamic tension; horizontally for calm.
<h4>Rule of Thirds for Horizons</h4>
Never center the horizon (unless reflections are the point). Place the horizon on the top third line when the foreground is interesting. Place it on the bottom third when the sky is dramatic.
<h4>Natural Framing</h4>
Tree branches, rock arches, doorways, and cliff edges frame the main subject and add depth layers.
<h4>Simplicity vs. Complexity</h4>
<ul>
<li>Minimalist landscapes (one subject, empty space) require perfect light and timing</li>
<li>Complex landscapes (many elements) need clear hierarchy — one thing must dominate</li>
</ul>
<span class="rule">Before you set up your tripod, walk the location for 10 minutes. Try different angles. Get low, get high, move left and right. The first spot you stopped is rarely the best composition.</span>
<div class="check"><strong>Project:</strong> Find a landscape location and shoot it from 5 different positions — including one from ground level, one from above, and one with a strong foreground element. Compare results.</div>`
        },
        {id:'ph-l16', title:'Filters, Long Exposure, and the Complete Landscape Kit', desc:'ND filters and polarizers unlock a range of landscape techniques that are impossible without them. Understanding when and how to use them completes your landscape toolkit.', min:40,
         content:`<h4>The Polarizing Filter (CPL)</h4>
<strong>What it does:</strong> Cuts reflected light. Deepens blue skies. Removes glare from water. Saturates colors in foliage.
<br><br>
<strong>When to use it:</strong> Any time you're shooting water, wet surfaces, or want a richer sky. Most effective when the sun is at 90 degrees to your lens.
<br><br>
<strong>How to use it:</strong> Attach and rotate while watching the effect in your viewfinder/screen. The effect changes as you rotate.
<br><br>
<strong>Limitation:</strong> Costs ~1–2 stops of light. Not effective with overcast skies (no direct light to polarize).
<h4>ND Filters (Neutral Density)</h4>
<strong>What they do:</strong> Reduce light entering the lens without affecting color. Allow long exposures in bright conditions.
<div class="ex">ND4 = 2 stops of light reduction → 1/250s becomes 1/60s<br>
ND64 = 6 stops → 1/250s becomes 1/4s<br>
ND1000 = 10 stops → 1/250s becomes 4 seconds</div>
<strong>Common uses:</strong>
<ul>
<li>Silky waterfall/river water: 1/4s to 2s → ND4 or ND16</li>
<li>Dramatic cloud motion: 15s to 60s → ND1000</li>
<li>Wide aperture in bright daylight for shallow depth of field: ND4–ND8</li>
</ul>
<h4>Graduated ND (GND)</h4>
Dark on top, clear on bottom. Reduces exposure of bright sky while keeping foreground exposed correctly. Most useful at golden hour when the sky is bright and the land is dark.
<h4>The Minimal Landscape Kit</h4>
<ul>
<li>Sturdy tripod</li>
<li>Remote shutter release (or use X-E5's 2-second timer)</li>
<li>Circular polarizer (sized for your lens)</li>
<li>ND64 or ND1000 (for long exposures)</li>
<li>Lens cloth (dew, sea spray)</li>
</ul>
<span class="rule">A good CPL and a good tripod will transform your landscape photography more than a camera upgrade. Invest there first.</span>
<div class="check"><strong>Project:</strong> Find a waterfall, stream, or fountain. Shoot it at 1/500s (frozen) and then at 1/2s or slower (silky). Compare the emotional impact of each. If you have an ND filter, try 5 seconds. Notice how the different shutter speeds tell completely different stories.</div>`
        },
      ]},
      { id:'ph-m5', title:'Building Your Practice', lessons:[
        {id:'ph-l17', title:'The Daily Shooting Habit', desc:'Mastery in photography is built through repetition, not gear. A consistent daily practice compounds faster than any course or workshop.', min:25,
         content:`<h4>The 15-Minute Practice</h4>
You don't need to go somewhere special to practice photography. A 15-minute walk from your front door with a camera builds skills faster than monthly "photography trips."
<h4>What to Practice Daily</h4>
<ul>
<li><strong>Light observation:</strong> Walk outside and identify the direction, quality, and color of light before picking up the camera</li>
<li><strong>One subject, many angles:</strong> Pick an ordinary object and photograph it 10 different ways</li>
<li><strong>Aperture control drills:</strong> Shoot the same subject at f/2, f/5.6, and f/16 — feel the difference</li>
<li><strong>Decisive moment training:</strong> Watch people or movement for 10 minutes without shooting. Then shoot for 5.</li>
</ul>
<h4>The 365 Project</h4>
One photograph per day for a year. Rules: no skipping, no retroactive shots. The discipline forces creativity when you "have nothing to shoot." The constraint is the point.
<h4>Why Consistency Beats Intensity</h4>
A weekend workshop gives you 2 days of intensive practice. A daily 15-minute habit gives you 91 hours over a year. The habit always wins.
<span class="rule">The camera that's with you is better than the camera at home. Keep the X-E5 in your bag every day. Most great photos are made on the way to somewhere else.</span>
<div class="check"><strong>Project:</strong> Commit to a 30-day daily photo practice. One photo per day, any subject. At the end of 30 days, print your 5 favorites and put them on a wall.</div>`
        },
        {id:'ph-l18', title:'Finding Your Visual Style', desc:'Your photographic style is not chosen — it emerges from what you keep returning to. The practice is to notice, not manufacture.', min:40,
         content:`<h4>What Visual Style Actually Is</h4>
Style is not a filter preset or a film simulation. It's a consistent set of choices: what you include, what you exclude, what light you seek, what moments you value, what your subjects feel like.
<h4>How to Find It</h4>
<strong>Step 1 — The 100-image audit:</strong> Pull your 100 best photos from the last year. Look for patterns without analyzing — what subjects keep appearing? What time of day? What mood?
<br><br>
<strong>Step 2 — Name what you see:</strong> "I keep photographing lone figures in open spaces." "I'm drawn to geometry and repetition." "All my favorites are in low, warm light." These are your tendencies — and they're your style.
<br><br>
<strong>Step 3 — Photographer research:</strong> Find 5 photographers whose work you admire. Study, don't copy. Ask: what are they choosing? What's left out of the frame? How do they use light?
<h4>Influences Worth Studying</h4>
<ul>
<li><strong>Street:</strong> Vivian Maier, Henri Cartier-Bresson, Daido Moriyama, Saul Leiter</li>
<li><strong>Landscape:</strong> Ansel Adams, Michael Kenna, Charlie Waite</li>
<li><strong>Documentary:</strong> Sebastião Salgado, Dorothea Lange, Mary Ellen Mark</li>
<li><strong>Contemporary:</strong> Search Instagram photographers in your genre — find one who makes you want to shoot</li>
</ul>
<span class="rule">Style is discovered through volume and reflection — not decided in advance. Shoot a lot. Look at what you make. The patterns will tell you who you are as a photographer.</span>
<div class="check"><strong>Project:</strong> Conduct the 100-image audit. Write 3 sentences describing what you see. Share it with one person who can give honest feedback.</div>`
        },
        {id:'ph-l19', title:'Portfolio Curation and Editing Your Work', desc:'The images you show define you more than the images you take. Editing ruthlessly is a discipline that separates amateurs from professionals.', min:35,
         content:`<h4>The Editing Hierarchy</h4>
<ol style="padding-left:18px;margin:6px 0">
<li><strong>Does it work technically?</strong> Sharp focus, clean exposure, no distracting elements that can't be cropped</li>
<li><strong>Does it work compositionally?</strong> Is the frame deliberate? Does every element serve the image?</li>
<li><strong>Does it work emotionally?</strong> Does it make you feel something or think something?</li>
<li><strong>Is it the best version of this image?</strong> If a similar shot is better, this one goes.</li>
</ol>
<h4>The 10% Rule</h4>
Keep no more than 10% of what you shoot. From a 100-image session, 10 is generous. From those 10, 2–3 are portfolio-worthy.
<h4>The Waiting Period</h4>
Don't edit images the same day you shoot them. Emotional attachment to your effort clouds judgment. Wait 24–48 hours. Look again. You'll see more clearly.
<h4>Building a Portfolio</h4>
A portfolio is not a gallery of everything good — it's a curated statement. 20 exceptional images with coherent style is stronger than 80 competent ones. Each image should earn its place by being better than the one it could replace.
<span class="rule">The best photographers are ruthless editors. "Pretty good" doesn't make the cut. Every image in your portfolio should represent your highest standard at the time it was made.</span>
<div class="check"><strong>Project:</strong> Select your single best photograph from the last 6 months. Write one paragraph about why it's your best — what decisions made it work. This exercise trains your critical eye more than any technical lesson.</div>`
        },
        {id:'ph-l20', title:'Photography as Revenue', desc:'Turning photography into income requires understanding which revenue models suit your style, skills, and time. Not every model works for every photographer.', min:50,
         content:`<h4>The Revenue Models</h4>
<strong>Client work (commission photography)</strong> — Paid shoots: events, portraits, real estate, commercial. Highest per-day rate, but income is inconsistent and requires sales/marketing skills.
<br><br>
<strong>Stock photography</strong> — Upload images to Shutterstock, Adobe Stock, Getty. Earn royalties over time. Low per-image rates but passive. Requires volume (1,000+ images).
<br><br>
<strong>Print sales</strong> — Sell physical prints through your own site (Squarespace, Format) or print-on-demand (Fine Art America). Works best when you have an audience.
<br><br>
<strong>Licensing</strong> — License specific images for specific uses (magazine editorial, advertising, website). Higher rates than stock for unique images.
<br><br>
<strong>Workshops and teaching</strong> — Teach locally or online (YouTube, Skillshare, your own course). Works when you've built reputation in a specific niche.
<br><br>
<strong>Social media / content creation</strong> — Build an audience around your photography. Monetize via sponsorships, affiliate links, or selling your own products.
<h4>The Honest Truth About Stock</h4>
Stock photography income has declined significantly. A realistic stock portfolio takes years to build and the rates are very low. Don't rely on it as primary income.
<h4>The Path That Works</h4>
<ol style="padding-left:18px;margin:6px 0">
<li>Build a specific niche (street, landscape, portrait, food)</li>
<li>Build an audience — Instagram, website, local reputation</li>
<li>Start with client work in your niche for cash flow</li>
<li>Add passive revenue streams (prints, stock, digital products) over time</li>
<li>Teach when your reputation is established</li>
</ol>
<span class="rule">Photography revenue follows reputation. Reputation follows consistency, quality, and clarity about what you shoot. Do the work first; the money follows a specific style and point of view.</span>
<div class="check"><strong>Project:</strong> Research one revenue model that fits your photography style. Identify three photographers who are successfully monetizing in that model. Study their pricing, their audience size, and how they market their work.</div>`
        },
      ]},
    ]
  },
  {
    id:'revenue', title:'Revenue Basics', emoji:'💰', accent:'#d97706', accentBg:'#fef3c7',
    desc:'B2B revenue mechanics — from bookings to ARR to GTM architecture',
    modules:[
      { id:'rv-m1', title:'The Revenue Stack', lessons:[
        {id:'rv-l1', title:'How Money Flows', desc:'One deal creates four different numbers. Understanding bookings, billings, revenue, and cash is the foundation of every revenue conversation.', min:30,
         content:`<h4>The Four Numbers</h4>
Every deal passes through four stages — each answers a different question.<br><br>
<strong>Bookings</strong> — What the customer committed to. <em>Did we win?</em><br>
<strong>Billings</strong> — What you invoice. <em>What are we owed?</em><br>
<strong>Revenue</strong> — What you earn as you deliver. <em>What did we earn?</em><br>
<strong>Cash</strong> — What lands in the bank. <em>Can we pay people?</em>
<h4>Worked Example</h4>
<div class="ex">$120K · 12-month contract · billed annually upfront · net 30<br><br>
Day 1 → Bookings $120K, Billings $120K<br>
Day 30 → Cash $120K arrives<br>
Each month → Revenue $10K ($120K ÷ 12)<br>
Unearned balance = deferred revenue, shrinks $10K/month</div>
<span class="rule">Rule: Billings follow the invoice. Revenue follows delivery, spread evenly over the term.</span>
<h4>Why This Matters</h4>
Sales is measured on bookings. Finance cares about revenue and cash. Mixing them up is the most common source of confusion in revenue conversations.
<div class="check"><div class="quiz-q"><strong>Practice Problem:</strong> A customer signs a 3-year deal at $80K/year, billed annually upfront, net 30. (a) ACV on day 1? (b) First-year billings? (c) Month-3 revenue? (d) Deferred revenue balance at end of month 6?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) $80K ACV. (b) $80K. (c) $6,667 ($80K ÷ 12). (d) $80K − ($6,667 × 6) = $40K remaining deferred.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'rv-l2', title:'ACV, TCV, and Contract Math', desc:'ACV and TCV are not interchangeable. Billing frequency changes invoice timing but not contract value or monthly revenue.', min:25,
         content:`<h4>Key Terms</h4>
<strong>ACV</strong> (Annual Contract Value) — One year of contract value.<br>
<strong>TCV</strong> (Total Contract Value) — Full-term value across all years.
<h4>Examples</h4>
<div class="ex">3-year deal at $120K/year<br>TCV = $360K &nbsp;|&nbsp; ACV = $120K</div>
<div class="ex">2-year deal at $90K/year, billed annually<br>TCV = $180K &nbsp;|&nbsp; ACV = $90K &nbsp;|&nbsp; First-year billings = $90K &nbsp;|&nbsp; Month-one revenue = $7,500</div>
<h4>Billing Frequency Twist</h4>
A 3-year deal at $60K/year, billed quarterly:<br>
<div class="ex">TCV = $180K &nbsp;|&nbsp; ACV = $60K<br>First-year billings = $60K (4 × $15K)<br>Month-one revenue = $5K ($60K ÷ 12)<br>Q1 billings = $15K</div>
<span class="rule">Billing frequency moves invoices and cash timing. Contract value and monthly revenue stay the same.</span>
<div class="check"><div class="quiz-q"><strong>Practice Problem:</strong> A customer signs a 2-year deal at $72K/year, billed quarterly. (a) TCV? (b) ACV? (c) Q1 billings? (d) Month-1 revenue? (e) They expand by $12K/year in month 10 — what is the new ACV?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) $144K. (b) $72K. (c) $18K. (d) $6K. (e) $84K.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'rv-l3', title:'ARR — What It Is and What It Isn\'t', desc:'ARR is a snapshot of recurring revenue, not a total of what you sold. Knowing what to include and exclude is critical.', min:25,
         content:`<h4>Definition</h4>
ARR is the <strong>annualized value of active recurring contracts at a point in time</strong>. It is a snapshot, not a period total.
<h4>What Goes In</h4>
<ul>
<li>Subscription and committed recurring fees</li>
</ul>
<h4>What Stays Out</h4>
<ul>
<li>One-time fees</li>
<li>Implementation and professional services</li>
<li>Variable/usage fees (unless committed)</li>
</ul>
<h4>Multi-Year Deals</h4>
<div class="ex">3-year deal at $60K/year → adds $60K of ARR, not $180K</div>
<span class="rule">Always use the annual value. TCV inflates ARR and creates misleading growth signals.</span>
<h4>ARR vs. MRR</h4>
MRR is monthly recurring revenue. ARR = MRR × 12. Use whichever matches your billing cadence; just never mix them in the same calculation.
<div class="check"><div class="quiz-q"><strong>Quiz:</strong> You sign three deals in Q1: (1) 1-year subscription at $120K. (2) 3-year deal at $60K/year. (3) $40K one-time implementation + $30K/year subscription. How much ARR do you add?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answer: $120K + $60K + $30K = $210K ARR. One-time fees are excluded. Multi-year deals count annual value only.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'rv-l4', title:'The ARR Bridge', desc:'The ARR bridge explains how ARR changes over a period. Net new ARR is the number leadership watches most.', min:35,
         content:`<h4>The Formula</h4>
<div class="ex">Ending ARR = Beginning ARR + New Logo + Expansion − Contraction − Churn</div>
<strong>New Logo</strong> — First-time customers<br>
<strong>Expansion</strong> — Upsell, cross-sell, usage growth<br>
<strong>Contraction</strong> — Downgrades (customer stays)<br>
<strong>Churn</strong> — Lost customers
<h4>Worked Example</h4>
<div class="ex">Start: $10.0M ARR<br>+ New logo: $1.2M &nbsp;+ Expansion: $0.8M = gains $2.0M<br>− Contraction: $0.3M &nbsp;− Churn: $0.5M = losses $0.8M<br>Net new ARR: $1.2M<br>Ending ARR: $11.2M</div>
<h4>The Method</h4>
<ol style="padding-left:18px;margin:6px 0">
<li>Total the gains</li>
<li>Total the losses</li>
<li>Net them → that's net new ARR</li>
<li>Add to beginning ARR → that's ending ARR</li>
</ol>
<div class="check"><strong>Self-check:</strong> Ending ARR minus beginning ARR must equal net new ARR. If they don't reconcile, one number is wrong.</div>
<div class="check"><div class="quiz-q"><strong>Practice Problem:</strong> Beginning ARR: $25M. New logo: $2.5M. Expansion: $1.8M. Contraction: $0.7M. Churn: $1.1M. (a) Net new ARR? (b) Ending ARR? (c) Self-check: do they reconcile?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) Gains $4.3M − Losses $1.8M = $2.5M net new. (b) $25M + $2.5M = $27.5M. (c) $27.5M − $25M = $2.5M ✓</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
      ]},
      { id:'rv-m2', title:'Retention Metrics', lessons:[
        {id:'rv-l5', title:'GRR — Measuring Base Health', desc:'Gross Revenue Retention measures how leaky your base is. It can never exceed 100%. Low GRR is a structural problem no amount of new logo can fix permanently.', min:30,
         content:`<h4>Formula</h4>
<div class="ex">GRR = (Beginning ARR − Contraction − Churn) ÷ Beginning ARR</div>
<ul>
<li>Expansion is <strong>excluded</strong> — only losses count</li>
<li>Capped at 100%</li>
<li>Answers: <em>how much of what we had do we still have?</em></li>
</ul>
<h4>Worked Example</h4>
<div class="ex">Beginning ARR: $10M &nbsp;|&nbsp; Contraction: $0.3M &nbsp;|&nbsp; Churn: $0.7M<br><br>
GRR = (10 − 0.3 − 0.7) ÷ 10 = 9.0 ÷ 10 = <strong>90%</strong></div>
<h4>Shortcut</h4>
Convert losses to a % of beginning ARR first. Losses = $0.3M + $0.7M = $1M = 10%. GRR = 100% − 10% = 90%.
<h4>Benchmarks</h4>
<ul>
<li>Enterprise SaaS: 90%+ is strong</li>
<li>SMB SaaS: 80%+ is acceptable (higher churn is expected)</li>
</ul>
<span class="rule">GRR below 80% means the business is leaking faster than it can fill. No new logo strategy solves a churn problem.</span>
<div class="check"><div class="quiz-q"><strong>Practice Problem:</strong> Beginning ARR: $30M. Contraction: $1.2M. Churn: $2.8M. Expansion: $3M (ignore for GRR). (a) What is GRR? (b) Losses as % of beginning ARR? (c) Is this strong for enterprise?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) (30 − 1.2 − 2.8) ÷ 30 = 26 ÷ 30 = 86.7%. (b) $4M ÷ $30M = 13.3%. (c) Below the 90% enterprise benchmark — needs improvement.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'rv-l6', title:'NRR — Does the Base Grow Itself?', desc:'Net Revenue Retention measures whether expansion offsets losses. Above 100% means you grow without adding a single new customer.', min:30,
         content:`<h4>Formula</h4>
<div class="ex">NRR = (Beginning ARR + Expansion − Contraction − Churn) ÷ Beginning ARR</div>
<ul>
<li>Expansion is <strong>included</strong></li>
<li>Can exceed 100%</li>
<li>Answers: <em>does the base grow on its own?</em></li>
</ul>
<h4>Worked Example</h4>
<div class="ex">Beginning ARR: $10M &nbsp;|&nbsp; Expansion: $1.5M &nbsp;|&nbsp; Contraction: $0.3M &nbsp;|&nbsp; Churn: $0.7M<br><br>
NRR = (10 + 1.5 − 0.3 − 0.7) ÷ 10 = 10.5 ÷ 10 = <strong>105%</strong></div>
<h4>Relationship to GRR</h4>
NRR − GRR = Expansion ÷ Beginning ARR. Use this to self-check your math.
<div class="ex">105% − 90% = 15% = $1.5M ÷ $10M ✓</div>
<h4>Benchmarks</h4>
<ul>
<li>110%+ NRR = strong (best-in-class enterprise)</li>
<li>100–110% = healthy</li>
<li>Below 100% = expansion isn't keeping up with leakage</li>
</ul>
<span class="rule">NRR above 100% is the compound growth engine. It means existing customers are funding future growth.</span>
<div class="check"><div class="quiz-q"><strong>Practice Problem (same numbers):</strong> Beginning ARR: $30M. Expansion: $3M. Contraction: $1.2M. Churn: $2.8M. (a) NRR? (b) NRR − GRR gap — what does it represent? (c) Is the base growing on its own?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) (30 + 3 − 1.2 − 2.8) ÷ 30 = 29 ÷ 30 = 96.7%. (b) 96.7% − 86.7% = 10% = $3M expansion ÷ $30M ✓. (c) No — NRR below 100% means the base is shrinking slightly despite expansion.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'rv-l7', title:'Logo Retention and What It Reveals', desc:'Dollar retention can mask logo churn. Tracking both exposes which customer segments are actually healthy.', min:20,
         content:`<h4>Why Logo Retention Matters</h4>
GRR and NRR are dollar metrics. A few large expansions or a few small churns can make the numbers look fine while hiding a deeper problem.
<h4>The Trap</h4>
<div class="ex">You have 100 customers at $1M ARR each and 500 customers at $10K ARR each.<br>If all 500 small customers churn, you lose $5M ARR (5% of base).<br>GRR = 95% — looks solid.<br>Logo retention = 83% — alarming.</div>
<h4>What to Track</h4>
<ul>
<li><strong>Dollar retention</strong> (GRR/NRR) — protects the P&L</li>
<li><strong>Logo retention</strong> — protects future pipeline and market position</li>
<li><strong>By cohort</strong> — tracks how each class of customers behaves over time</li>
</ul>
<span class="rule">Strong dollar retention with weak logo retention means you're losing small customers. The short-term numbers look fine; the long-term pipeline is eroding.</span>
<div class="check"><div class="quiz-q"><strong>Scenario:</strong> You have 200 customers: 20 enterprise at $500K ARR each ($10M), 180 SMB at $10K each ($1.8M). Total ARR = $11.8M. In Q1: 30 SMB customers churn ($300K ARR lost), one enterprise expands by $100K. (a) Dollar GRR? (b) Logo retention rate? (c) What story do these numbers tell together?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) ($11.8M − $300K) ÷ $11.8M = 97.5% — looks excellent. (b) 170 ÷ 200 = 85% — warning sign. (c) High dollar GRR is masking significant logo churn in SMB. One enterprise expansion hides the damage.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'rv-l8', title:'Reading GRR and NRR Together', desc:'The combination of GRR and NRR tells a richer story than either metric alone. Learn to diagnose what the pair is actually saying.', min:25,
         content:`<h4>The Four Patterns</h4>
<div class="ex"><strong>High NRR + High GRR (e.g. 120% / 95%)</strong><br>Best-in-class. Sticky base, strong expansion motion. Typical of product-led growth or deep enterprise platforms.</div>
<div class="ex"><strong>High NRR + Low GRR (e.g. 115% / 82%)</strong><br>Fragile. A few big expansions are masking significant churn. One lost whale and NRR collapses. Fix the base first.</div>
<div class="ex"><strong>High GRR + Modest NRR (e.g. 92% / 98%)</strong><br>Sticky but flat. Customers stay but don't grow. The opportunity is expansion — price architecture, upsell motion, CSM incentives.</div>
<div class="ex"><strong>Low GRR + Low NRR (e.g. 75% / 80%)</strong><br>Product-market fit or delivery problem. No GTM fix solves this. Diagnose why customers are leaving.</div>
<h4>The Diagnostic Question</h4>
Always ask: <em>Is expansion real growth, or is it just replacing what's churning?</em><br><br>
