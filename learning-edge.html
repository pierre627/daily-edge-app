If NRR ≈ 100% with high churn, expansion is running on a treadmill.
<div class="check"><div class="quiz-q"><strong>Diagnostic:</strong> Company A: GRR 88%, NRR 125%. Company B: GRR 95%, NRR 102%. (a) Which has better base health? (b) Which has better expansion? (c) Which would you rather be — and what's the risk?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) Company B (95% GRR). (b) Company A (expansion = 37% of base). (c) Both are viable. Company A is fragile if expansion slows — one bad quarter breaks NRR. Company B has a strong foundation but needs to build an expansion motion.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
      ]},
      { id:'rv-m3', title:'Unit Economics', lessons:[
        {id:'rv-l9', title:'CAC — What a Customer Actually Costs', desc:'Customer Acquisition Cost is frequently miscalculated. The blended number hides what it actually costs to win in each segment.', min:30,
         content:`<h4>Formula</h4>
<div class="ex">CAC = Total Sales & Marketing Spend ÷ New Customers Acquired</div>
<h4>What to Include in S&M Spend</h4>
<ul>
<li>Sales salaries, commissions, and benefits</li>
<li>Marketing salaries and benefits</li>
<li>Advertising and demand generation spend</li>
<li>Sales tools, CRM, and enablement</li>
<li>Allocated overhead (real estate, etc.)</li>
</ul>
<h4>Why Blended CAC Misleads</h4>
Enterprise and commercial deals have radically different costs and cycles. A blended CAC hides that enterprise may have a 12-month payback and commercial 6 months — or vice versa. Always cut CAC by segment.
<h4>Payback Period</h4>
<div class="ex">CAC Payback = CAC ÷ (New ARR × Gross Margin)<br><br>
Under 18 months = generally healthy for enterprise<br>Under 12 months = efficient<br>Over 24 months = capital-intensive, needs scrutiny</div>
<span class="rule">CAC without payback is vanity. CAC payback by segment is actionable.</span>
<div class="check"><div class="quiz-q"><strong>Practice Problem:</strong> Your enterprise team spends $2.4M on S&amp;M in Q1 and acquires 8 new customers averaging $200K new ARR each at 75% gross margin. (a) CAC per customer? (b) CAC payback in months? (c) Is this healthy?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) $2.4M ÷ 8 = $300K CAC. (b) $300K ÷ ($200K × 75%) = $300K ÷ $150K = 24 months. (c) At the edge — acceptable for enterprise but worth investigating whether CAC can be reduced.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'rv-l10', title:'LTV — Lifetime Value and How It\'s Misused', desc:'LTV is often inflated by optimistic churn assumptions. The honest version is more useful than the impressive one.', min:30,
         content:`<h4>Formula</h4>
<div class="ex">LTV = (ARPA × Gross Margin) ÷ Churn Rate</div>
ARPA = Average Revenue Per Account (annual)
<h4>Example</h4>
<div class="ex">ARPA: $60K &nbsp;|&nbsp; Gross Margin: 75% &nbsp;|&nbsp; Annual Churn: 10%<br><br>
LTV = ($60K × 0.75) ÷ 0.10 = $45K ÷ 0.10 = <strong>$450K</strong></div>
<h4>LTV:CAC</h4>
<ul>
<li>3:1 or better = generally healthy benchmark</li>
<li>Below 1:1 = you're losing money on every customer</li>
<li>Above 5:1 = may be under-investing in growth</li>
</ul>
<h4>Why LTV Is Often Wrong</h4>
<ul>
<li>Churn is underestimated (use trailing 4-quarter actuals, not targets)</li>
<li>Gross margin excludes customer success costs it shouldn't</li>
<li>Doesn't discount future cash flows</li>
</ul>
<span class="rule">Use LTV for directional decisions and segment comparisons. Don't build a business case on a precise LTV number.</span>
<div class="check"><div class="quiz-q"><strong>Practice Problem:</strong> Segment A: ARPA $48K, gross margin 80%, annual churn 8%. Segment B: ARPA $12K, gross margin 75%, annual churn 20%. (a) LTV for each? (b) LTV:CAC if Segment A CAC = $120K and Segment B CAC = $15K?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) Seg A: ($48K × 0.80) ÷ 0.08 = $480K. Seg B: ($12K × 0.75) ÷ 0.20 = $45K. (b) Seg A: 4:1 ✓. Seg B: 3:1 ✓. Both healthy — Seg A has higher absolute LTV but requires 8× more CAC.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'rv-l11', title:'CAC Payback and Efficiency Metrics', desc:'CAC payback period is the most operationally useful unit economics metric. Pair it with the Magic Number to assess GTM efficiency.', min:35,
         content:`<h4>CAC Payback Period</h4>
<div class="ex">CAC Payback (months) = CAC ÷ (New ARR × Gross Margin)</div>
Answers: <em>How many months until a new customer has paid back what it cost to acquire them?</em>
<h4>Magic Number</h4>
<div class="ex">Magic Number = Net New ARR in the Quarter ÷ Prior Quarter S&M Spend</div>
<ul>
<li>Above 0.75 = efficient GTM spend</li>
<li>Above 1.0 = very efficient; accelerate investment</li>
<li>Below 0.5 = investigate before adding more spend</li>
</ul>
<h4>Rule of 40</h4>
<div class="ex">Growth Rate % + Profit Margin % ≥ 40%</div>
A blended health check used by investors. A company growing 30% with 10% operating margin = 40. One growing 60% at −15% margin = 45.
<h4>Why These Work Together</h4>
Magic Number tells you if this quarter's spend was efficient. CAC payback tells you when you get the money back. Rule of 40 tells you if the overall business is balanced.
<span class="rule">Efficiency metrics matter most at scale. Early-stage, growth rate dominates. Series B and beyond, payback and magic number start to drive valuation multiples.</span>
<div class="check"><div class="quiz-q"><strong>Practice Problem:</strong> Q2 net new ARR = $1.8M. Q1 S&amp;M spend = $900K. Growth rate = 35%. Operating margin = 8%. (a) Magic Number? (b) What does it signal? (c) Does the business pass Rule of 40?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) $1.8M ÷ $900K = 2.0 — excellent. (b) Strong signal to accelerate S&amp;M investment — every dollar of spend generated $2 of ARR. (c) 35% + 8% = 43% ≥ 40 ✓ passes.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'rv-l12', title:'Quota, Capacity, and Attainment', desc:'Revenue capacity math is how you model the team you need to hit the number. Attainment distribution is how you know if the current team is healthy.', min:30,
         content:`<h4>Quota Capacity</h4>
<div class="ex">Quota Capacity = Ramped Reps × Quota × Expected Attainment</div>
New hires are not full capacity until they ramp. Discount their quota accordingly.
<h4>Ramp Time</h4>
Track time to first deal and time to full productivity by hire cohort. Common enterprise ramp: 6–9 months to full productivity. Use trailing actuals, not HR assumptions.
<h4>Quota Overassignment</h4>
Typically set at 110–120% of the revenue target. If the target is $10M and average attainment is 85%, you need to assign $11.7M to land $10M.
<div class="ex">Needed quota assignment = Target ÷ Expected attainment rate</div>
<h4>Attainment Distribution</h4>
The average attainment hides the health of the team. Look at the distribution:
<ul>
<li><strong>Healthy:</strong> 60–70% of reps at or above 100%</li>
<li><strong>Warning:</strong> Average is 80% but only 40% are at quota — a few top performers are masking the rest</li>
</ul>
<span class="rule">Track bias (consistent over- or under-forecasting) separately from variance. Bias is a coaching problem. Variance is a data quality problem.</span>
<div class="check"><div class="quiz-q"><strong>Practice Problem:</strong> Revenue target: $12M. 15 reps, $1M quota each, historical attainment 78%. (a) Quota capacity? (b) Can the team hit $12M? (c) How many reps needed at 78% attainment to hit $12M with $1M quotas?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) 15 × $1M × 78% = $11.7M. (b) No — $300K short. (c) $12M ÷ ($1M × 78%) = 15.4 → need 16 fully ramped reps. Hire ahead of ramp time.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
      ]},
      { id:'rv-m4', title:'Pipeline & Forecast', lessons:[
        {id:'rv-l13', title:'Pipeline Coverage — Why 3x Is Wrong', desc:'Coverage is meaningful only when set from actual conversion rates by segment. A fixed 3x target is a guess dressed as a standard.', min:25,
         content:`<h4>Coverage Formula</h4>
<div class="ex">Coverage = Open Pipeline ÷ Remaining Quota (or Target)</div>
<h4>Why 3x Is Misleading</h4>
A 3x coverage target assumes a 33% win rate. But if your enterprise segment converts at 25% and commercial at 50%, you need:
<ul>
<li>Enterprise: 4x coverage</li>
<li>Commercial: 2x coverage</li>
</ul>
Setting 3x for both is wrong in both directions.
<h4>Setting the Right Target</h4>
Use trailing 4-quarter conversion by: segment, source (inbound vs. outbound), and deal size. Recalculate quarterly.
<h4>Pipeline Quality Signals</h4>
<ul>
<li><strong>Pipeline created:</strong> Track the share that reaches mid-stage within 90 days — anything that doesn't is likely junk</li>
<li><strong>Deal aging:</strong> Compare each open deal to the age distribution of won deals. Past the 75th percentile of won-deal age, close rates fall sharply</li>
</ul>
<span class="rule">Coverage without conversion rates is theater. Coverage by segment from real data is a planning tool.</span>
<div class="check"><div class="quiz-q"><strong>Practice Problem:</strong> Q3 target: $5M. Pipeline: $10M enterprise (28% win rate) + $4M commercial (45% win rate). (a) Blended coverage? (b) Expected revenue from pipeline? (c) Sufficiently covered?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) $14M ÷ $5M = 2.8x. (b) ($10M × 28%) + ($4M × 45%) = $2.8M + $1.8M = $4.6M. (c) No — despite 2.8x coverage, segment-weighted conversion only produces $4.6M vs. $5M target. Need more enterprise pipeline.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'rv-l14', title:'Win Rate — The Number That Hides Everything', desc:'The blended win rate is nearly useless for decision-making. Cut it by every dimension that matters and you\'ll see where you actually win and lose.', min:30,
         content:`<h4>Basic Formula</h4>
<div class="ex">Win Rate = Won ÷ (Won + Lost)</div>
<h4>Why Blended Win Rate Is Useless</h4>
A 30% blended win rate could mean:
<ul>
<li>Enterprise: 45% &nbsp;|&nbsp; Commercial: 20%</li>
<li>Inbound: 55% &nbsp;|&nbsp; Outbound: 15%</li>
<li>Competitive deals: 25% &nbsp;|&nbsp; No-competition: 65%</li>
</ul>
The blended number hides all of this.
<h4>Dimensions to Cut</h4>
<ul>
<li>Segment (enterprise, commercial, SMB)</li>
<li>Source (inbound, outbound, partner, expansion)</li>
<li>Deal size (by ACV band)</li>
<li>Competitor (who you win against, who beats you)</li>
<li>Rep (identify coaching opportunities)</li>
</ul>
<h4>Cohort vs. Period</h4>
Win rate on deals <em>closed</em> in a period flatters you — slow losers fall outside the window. Measure by <em>creation cohort</em> (deals created in Q1 and tracked to resolution) for an honest picture.
<span class="rule">Win rate by competitor is where deals are won and lost. If you don't know it, you can't train to it.</span>
<div class="check"><div class="quiz-q"><strong>Scenario:</strong> Blended Q2 win rate: 32%. Inbound = 40% of deals at 58% win rate. Outbound = 60% at 18%. (a) Does the math reconcile? (b) Where should you focus investment?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) (40% × 58%) + (60% × 18%) = 23.2% + 10.8% = 34% ≈ 32% ✓ (rounding). (b) Outbound generates 60% of deals at under 1/3 the inbound conversion rate. Options: improve outbound qualification, shift to inbound, or compensate with outbound volume.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'rv-l15', title:'Sales Velocity — The Four-Lever Framework', desc:'Sales velocity combines four variables into one number that shows which lever moves revenue most. Use it to prioritize, not as a target.', min:30,
         content:`<h4>Formula</h4>
<div class="ex">Sales Velocity = (Opportunities × Win Rate × ACV) ÷ Average Sales Cycle (days)</div>
<h4>The Four Levers</h4>
<ul>
<li><strong>Volume (Opportunities):</strong> More pipeline → more revenue at the same conversion</li>
<li><strong>Conversion (Win Rate):</strong> Win more of what's already in the pipe</li>
<li><strong>Value (ACV):</strong> Bigger deals with the same effort</li>
<li><strong>Velocity (Cycle Length):</strong> Close faster → dollars arrive sooner</li>
</ul>
<h4>How to Use It</h4>
Calculate velocity for each segment separately. Then ask: if I move each lever by 10%, which one produces the most incremental revenue?
<div class="ex">A 10% improvement in win rate usually beats a 10% improvement in pipeline volume — because it applies to every deal already in the funnel.</div>
<h4>The One Idea Underneath Everything</h4>
Every revenue metric maps to one of these four levers. Pipeline coverage = volume. Win rate = conversion. ACV = value. Sales cycle = velocity.
<span class="rule">When a revenue number misses, identify which lever broke down. That's where you coach, hire, or change process.</span>
<div class="check"><div class="quiz-q"><strong>Practice Problem:</strong> Current: 80 opportunities, 30% win rate, $85K ACV, 95-day cycle. (a) Sales velocity? (b) Which single 10% improvement produces the most incremental velocity?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) (80 × 0.30 × $85K) ÷ 95 = $21,474/day. (b) 10% win rate improvement (to 33%): (80 × 0.33 × $85K) ÷ 95 = $22,484/day (+$1,010). 10% ACV improvement: $22,221/day (+$747). Win rate wins — it compounds across all existing pipeline.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'rv-l16', title:'Forecast Categories and Forecast Quality', desc:'A forecast is only as good as the discipline behind the categories. Tracking bias separately from variance is how you improve.', min:25,
         content:`<h4>The Four Categories</h4>
<ul>
<li><strong>Commit:</strong> High confidence. You would stake your call on this closing. Only deals here that you've personally verified.</li>
<li><strong>Best Case:</strong> Plausible upside beyond commit. Needs specific conditions to close.</li>
<li><strong>Pipeline:</strong> Early stage, not yet forecastable. In the funnel but not in the call.</li>
<li><strong>Closed Won:</strong> Done.</li>
</ul>
<h4>Commit Discipline</h4>
The commit category is only valuable if it's treated as a real commitment. When reps put everything in commit to look good and then miss, it destroys forecast accuracy. Inspect the commit list by asking: "What would have to happen for this not to close?"
<h4>Bias vs. Variance</h4>
<div class="ex"><strong>Bias:</strong> Consistently over- or under-forecasting by the same amount each period.<br>→ A coaching and discipline problem. Usually fixable.</div>
<div class="ex"><strong>Variance:</strong> Unpredictable swings in either direction.<br>→ A data quality and process problem. Requires stage definition work.</div>
<h4>Inspection Cadence</h4>
Weekly commit call. Monthly pipeline review. Quarterly capacity planning. Each has a different purpose — don't conflate them.
<span class="rule">Track forecast accuracy by rep over rolling quarters. It's the most honest measure of rep judgment and pipeline quality.</span>
<div class="check"><div class="quiz-q"><strong>Scenario:</strong> Rep A commits $450K/quarter, closes $380K–$420K. Rep B commits $600K, closes $300K–$550K. (a) Who is more forecastable? (b) Who has bias vs. variance? (c) What's the different coaching approach?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) Rep A — consistent and predictable. (b) Rep A: low bias, low variance. Rep B: high bias (over-commits) and high variance (unpredictable). (c) Rep A: focus on raising the ceiling — what would make commit more reliable at $500K? Rep B: tighten commit criteria — what's really commit vs. best case?</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
      ]},
      { id:'rv-m5', title:'GTM Architecture', lessons:[
        {id:'rv-l17', title:'The Bowtie Funnel', desc:'The Bowtie extends the funnel past the close into onboarding, impact, and expansion. The post-sale half is revenue, not support.', min:35,
         content:`<h4>Why the Traditional Funnel Is Wrong</h4>
The classic funnel ends at "closed won." In a recurring revenue business, that's the halfway point. The real revenue happens after the sale.
<h4>The Bowtie Model (Winning by Design)</h4>
<div class="ex">PRE-SALE: Awareness → Education → Selection → Commitment (Close)<br>── the tie point ──<br>POST-SALE: Onboarding → Impact → Expansion → Advocacy</div>
<h4>The Key Insight</h4>
<ul>
<li>Pre-sale: You're convincing someone to pay</li>
<li>Post-sale: You're delivering on that promise</li>
<li>Expansion: You're earning the right to grow the account</li>
</ul>
The tie point (the close) is where most companies put all their process, tooling, and leadership attention. Best-in-class companies invest equally post-sale.
<h4>Metrics on Each Side</h4>
<ul>
<li>Pre-sale: Coverage, win rate, cycle, ACV</li>
<li>Post-sale: Time to first value, GRR, NRR, expansion rate</li>
</ul>
<span class="rule">If your CSM team is understaffed relative to your AE team, you're building a leaky bucket and calling it a growth strategy.</span>
<div class="check"><div class="quiz-q"><strong>Scenario:</strong> Your NRR is 87% and new logo ARR is growing 40% YoY. (a) What does 87% NRR mean structurally? (b) If you stopped adding new logos, what happens to ARR over 3 years? (c) Where does the Bowtie say to invest?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) You lose 13% of the base every year. New logo is filling a leaky bucket. (b) $1M → $870K → $757K → $658K — 34% decline. (c) The post-sale motion is broken: onboarding, CSM, impact delivery. No AE hiring solves 87% NRR.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'rv-l18', title:'Stage Definitions and Conversion', desc:'Stage definitions based on what the buyer has done — not what the rep has done — create forecasts you can actually trust.', min:30,
         content:`<h4>The Core Problem</h4>
Most CRM stages are defined by rep activity: "Demo Scheduled," "Proposal Sent," "Contract Out." These measure what the seller did, not what the buyer decided. A deal can sit in "Proposal Sent" for 90 days.
<h4>Buyer-Action Stage Definitions</h4>
Define stages by what the buyer has <em>done</em>:
<div class="ex">Stage 1: Prospect agreed to an initial conversation<br>
Stage 2: Buyer confirmed the problem and agreed to evaluate<br>
Stage 3: Buyer identified internal champion and defined success criteria<br>
Stage 4: Buyer completed technical validation<br>
Stage 5: Buyer approved business case internally<br>
Stage 6: Legal/procurement engaged — close expected</div>
<h4>Why This Matters for Forecast</h4>
Buyer-action stages are much harder to game. A rep can't advance a deal to Stage 4 by sending a proposal — the buyer has to have done something verifiable.
<h4>Stage Conversion Rate</h4>
Track the percentage advancing from each stage to the next. A drop-off at Stage 3 usually means discovery is weak. A drop-off at Stage 5 usually means economic buyer isn't engaged.
<span class="rule">Stage conversion rates by source and segment are the most actionable data set in B2B sales. They tell you exactly where deals die and why.</span>
<div class="check"><div class="quiz-q"><strong>Diagnostic:</strong> 60% of deals stall at Stage 3 (buyer confirmed problem, no internal champion yet). (a) What's breaking down? (b) What do you change in the sales process? (c) How would you rewrite the Stage 3 exit criteria?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) Reps aren't getting multi-threaded — working one contact but not accessing the economic buyer. (b) Add a champion enablement step: rep helps the champion present internally and get at least one other stakeholder engaged. (c) New exit criteria: "Champion has shared solution overview with ≥2 internal stakeholders and confirmed budget authority path."</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'rv-l19', title:'GTM Org Design and Handoffs', desc:'Revenue leaks at handoffs. AE → CSM → Renewal → AM transitions are where the Bowtie breaks down in practice.', min:35,
         content:`<h4>The Four Revenue Roles</h4>
<ul>
<li><strong>AE (Account Executive):</strong> Owns pre-sale. Closes new logo and upsells in accounts they own.</li>
<li><strong>CSM (Customer Success Manager):</strong> Owns post-sale onboarding and impact delivery. Defines success, tracks health, surfaces expansion signals.</li>
<li><strong>AM (Account Manager):</strong> Owns expansion in mature accounts. Runs commercial conversations CSMs shouldn't own.</li>
<li><strong>Renewal:</strong> Owns the renewal transaction. Separate from CSM in larger orgs; combined in smaller ones.</li>
</ul>
<h4>Where Orgs Break Down</h4>
<ul>
<li>AE closes and hands off with no context transfer → CSM starts from scratch</li>
<li>CSM owns expansion without commercial training → deals die in discovery</li>
<li>No clear renewal owner → it falls to whoever's closest to the date</li>
<li>Comp misalignment → AE oversells, CSM underdelivers, NRR suffers</li>
</ul>
<h4>The Fix</h4>
Define handoff criteria (what must be true before a deal transfers), comp overlap to align incentives across the hand-off, and joint success plans that live in the CRM.
<span class="rule">Org design is revenue architecture. Draw the handoffs on a whiteboard and ask: where does accountability disappear? That's where revenue leaks.</span>
<div class="check"><div class="quiz-q"><strong>Scenario:</strong> AE closes a deal. CSM receives a handoff email with contract value and contact name only — has never spoken to the customer. Time to First Value (TTV) target is 30 days; actual is 75 days. (a) What handoff failure does this describe? (b) What is TTV likely doing to NRR? (c) Design a better handoff in 3 steps.</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) No context transfer — CSM restarts the relationship from zero. (b) Slow TTV correlates with early churn. Customers who don't see value in 60–90 days are high risk; NRR is depressed by preventable early losses. (c) Step 1: AE completes handoff doc (why they bought, success criteria, key contacts, risks). Step 2: 3-way intro call before close. Step 3: CSM joins the final deal stage pre-close to build the relationship early.</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
        {id:'rv-l20', title:'The Four Levers and Diagnostics', desc:'Volume, conversion, velocity, and value. Every revenue metric maps to one of these four. Use the framework to diagnose misses and prioritize fixes.', min:40,
         content:`<h4>The Framework</h4>
<div class="ex">Revenue = f(Volume, Conversion, Velocity, Value)</div>
<ul>
<li><strong>Volume:</strong> Number of opportunities entering the funnel</li>
<li><strong>Conversion:</strong> Win rate at each stage</li>
<li><strong>Velocity:</strong> Speed through the funnel (sales cycle length)</li>
<li><strong>Value:</strong> Average contract value (ACV)</li>
</ul>
<h4>Mapping Every Metric</h4>
<div class="ex">Pipeline coverage → Volume<br>
Win rate, stage conversion → Conversion<br>
Sales cycle, time-to-close → Velocity<br>
ACV, expansion rate, upsell → Value<br>
GRR → Conversion (retention)<br>
NRR → Value + Conversion combined</div>
<h4>Diagnosing a Miss</h4>
When the number misses, work backwards:
<ol style="padding-left:18px;margin:6px 0">
<li>Was pipeline sufficient? (Volume)</li>
<li>Did we win our fair share? (Conversion)</li>
<li>Did deals take longer than expected? (Velocity)</li>
<li>Were deals smaller than modeled? (Value)</li>
</ol>
One of these four is always the root cause. Find it before building a recovery plan.
<h4>The Prioritization Principle</h4>
Improving conversion usually has the highest leverage because it applies to all the pipeline already in the funnel. Improving volume requires more input. Improving ACV requires positioning and packaging changes that take longer.
<div class="check"><strong>Framework rule:</strong> Pair every lagging metric (bookings, NRR) with a leading one (stage conversion, aging, coverage). Lagging metrics tell you what happened. Leading metrics tell you what's coming.</div>
<div class="check"><div class="quiz-q"><strong>Diagnostic Exercise:</strong> Q3 missed by $1.2M. Pipeline entering the quarter was $8M vs. $4M target (2x coverage). Win rate: 25% vs. modeled 35%. ACV: $72K vs. modeled $80K. (a) Map the miss to the four levers. (b) Which lever had the biggest impact? (c) What do you investigate first?</div><textarea class="quiz-input" placeholder="Work through your answer here…"></textarea><button class="quiz-reveal-btn" onclick="revealQuizAnswer(this)">Check Answer →</button><div class="quiz-reveal" style="display:none"><div class="quiz-answer-box"><em>Answers: (a) Volume: fine. Conversion: 10-point win rate miss on $8M pipeline ≈ $800K lost. Value: $8K ACV miss ≈ $200–300K lost. (b) Conversion (win rate) had the largest impact. (c) Cut win rate by segment and rep — where did it drop? Competitive losses, late-stage stalls, or economic buyer not engaged?</em></div><div class="quiz-self-check"><span class="quiz-sc-lbl">How'd you do?</span><button class="quiz-got-btn" onclick="markQuiz(this,'got')">✓ Got it</button><button class="quiz-miss-btn" onclick="markQuiz(this,'missed')">✗ Missed it</button></div></div></div>`
        },
      ]},
    ]
  }
];

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let currentUser   = null;
let progress      = {};   // {[trackId]: {[lessonId]: {status, notes, completedAt}}}
let learningLog   = [];   // [{date, minutes, trackId}]
let generalNotes  = '';   // freeform notepad
let dailyGoal     = parseInt(localStorage.getItem('le_daily_goal')||'30');
let activeTab     = 'tracks';
let expanded      = {};   // {[moduleId]: bool}
let modalCtx      = null;
let modalStatus   = 'not_started';
let modalNewMin   = 0;
let saveTimer     = null;
let notesSaveTimer= null;

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtMin(m){ if(!m) return ''; return m>=60?`${Math.floor(m/60)}h ${m%60>0?' '+m%60+'m':''}`:`${m}m`; }

function getLessonStatus(trackId, lessonId){
  return progress?.[trackId]?.[lessonId]?.status || 'not_started';
}
function getLessonNotes(trackId, lessonId){
  return progress?.[trackId]?.[lessonId]?.notes || '';
}
function statusIcon(s){
  if(s==='completed')   return '<span style="color:#22c55e;font-size:13px">✓</span>';
  if(s==='in_progress') return '<span style="color:#d97706;font-size:12px">◑</span>';
  return '<span style="color:#cbd5e1;font-size:12px">○</span>';
}
function calcTrackProgress(trackId){
  const track = TRACKS.find(t=>t.id===trackId); if(!track) return {done:0,total:0,pct:0};
  let done=0, total=0;
  track.modules.forEach(m=>m.lessons.forEach(l=>{
    total++;
    if(getLessonStatus(trackId,l.id)==='completed') done++;
  }));
  return {done, total, pct: total>0 ? Math.round(done/total*100) : 0};
}
function calcAllProgress(){
  let done=0, total=0;
  TRACKS.forEach(t=>{ const p=calcTrackProgress(t.id); done+=p.done; total+=p.total; });
  return {done, total, pct: total>0 ? Math.round(done/total*100) : 0};
}
function todayMinutes(){
  return learningLog.filter(e=>e.date===todayStr()).reduce((s,e)=>s+e.minutes,0);
}
function calcStreak(){
  const dates=new Set(learningLog.map(e=>e.date));
  let streak=0, d=new Date();
  if(!dates.has(todayStr())) d.setDate(d.getDate()-1);
  while(dates.has(d.toISOString().slice(0,10))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function totalMinutes(){
  return learningLog.reduce((s,e)=>s+e.minutes,0);
}
function getNextLesson(){
  for(const track of TRACKS){
    for(const mod of track.modules){
      for(const lesson of mod.lessons){
        if(getLessonStatus(track.id,lesson.id)==='in_progress') return {track,mod,lesson};
      }
    }
  }
  for(const track of TRACKS){
    for(const mod of track.modules){
      for(const lesson of mod.lessons){
        if(getLessonStatus(track.id,lesson.id)==='not_started') return {track,mod,lesson};
      }
    }
  }
  return null;
}

// ═══════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════
const lsProgKey  = ()=>`le_prog_${currentUser?.id}`;
const lsLogKey   = ()=>`le_log_${currentUser?.id}`;
const lsNotesKey = ()=>`le_notes_${currentUser?.id}`;

function saveLocal(){
  try{ localStorage.setItem(lsProgKey(),  JSON.stringify(progress)); }catch(e){}
  try{ localStorage.setItem(lsLogKey(),   JSON.stringify(learningLog)); }catch(e){}
  try{ localStorage.setItem(lsNotesKey(), generalNotes); }catch(e){}
}
function loadLocal(){
  try{ const v=localStorage.getItem(lsProgKey());  if(v) progress=JSON.parse(v); }catch(e){}
  try{ const v=localStorage.getItem(lsLogKey());   if(v) learningLog=JSON.parse(v); }catch(e){}
  try{ const v=localStorage.getItem(lsNotesKey()); if(v) generalNotes=v; }catch(e){}
}

function setSyncStatus(s){
  const dot=document.getElementById('syncDot'); if(!dot) return;
  dot.classList.remove('show','offline');
  if(s==='saving') dot.classList.add('show');
  if(s==='offline') dot.classList.add('offline');
}
window.addEventListener('online',  ()=>{ setSyncStatus(''); flushToSupabase(); });
window.addEventListener('offline', ()=>setSyncStatus('offline'));

async function flushToSupabase(){
  if(!currentUser||!navigator.onLine) return;
  setSyncStatus('saving');
  try{
    const{error}=await sb.from('reading_tracker').upsert([
      {user_id:currentUser.id, key:'le_progress', data:{progress},           updated_at:new Date().toISOString()},
      {user_id:currentUser.id, key:'le_log',      data:{log:learningLog},    updated_at:new Date().toISOString()},
      {user_id:currentUser.id, key:'le_notes',    data:{notes:generalNotes}, updated_at:new Date().toISOString()},
    ],{onConflict:'user_id,key'});
    setSyncStatus(error?'offline':'');
  }catch(e){ setSyncStatus('offline'); }
}

function persistData(){
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flushToSupabase, 800);
}

// ═══════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════
function cacheUser(u){ try{localStorage.setItem('le_user',JSON.stringify({id:u.id,email:u.email}));}catch(e){} }
function getCachedUser(){ try{const v=localStorage.getItem('le_user');return v?JSON.parse(v):null;}catch(e){return null;} }

sb.auth.onAuthStateChange((event,session)=>{
  if(session?.user){
    currentUser=session.user; cacheUser(session.user);
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='block';
    startApp();
  } else {
    const cached=getCachedUser();
    if(cached&&!navigator.onLine){
      currentUser=cached;
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('app').style.display='block';
      startApp(); setSyncStatus('offline');
    } else {
      currentUser=null;
      document.getElementById('loginScreen').style.display='flex';
      document.getElementById('app').style.display='none';
    }
  }
});

async function signIn(){
  await sb.auth.signInWithOAuth({provider:'google',
    options:{redirectTo:location.href.split('#')[0].split('?')[0]}});
}

async function signOut(){
  localStorage.removeItem('le_user');
  await sb.auth.signOut();
  currentUser=null;
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('app').style.display='none';
}

// ═══════════════════════════════════════════
// STARTUP
// ═══════════════════════════════════════════
async function startApp(){
  loadLocal();
  render();
  try{
    const{data}=await sb.from('reading_tracker').select('key,data').eq('user_id',currentUser.id)
      .in('key',['le_progress','le_log','le_notes']);
    if(!data) return;
    const pRow=data.find(r=>r.key==='le_progress');
    const lRow=data.find(r=>r.key==='le_log');
    const nRow=data.find(r=>r.key==='le_notes');
    if(pRow?.data?.progress)   progress=pRow.data.progress;
    if(lRow?.data?.log)        learningLog=lRow.data.log;
    if(nRow?.data?.notes!=null) generalNotes=nRow.data.notes;
    saveLocal();
  }catch(e){}
  render();
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function render(){
  const allP=calcAllProgress();
  const sub=document.getElementById('appSub');
  if(sub) sub.textContent=`${allP.done} of ${allP.total} lessons complete · ${allP.pct}%`;
  renderTracks();
  renderToday();
  renderProgress();
  renderNotes();
}

// ── Tracks ──
function renderTracks(){
  const el=document.getElementById('tracksContent'); if(!el) return;
  el.innerHTML=TRACKS.map(track=>{
    const {done,total,pct}=calcTrackProgress(track.id);
    const modulesHtml=track.modules.map((mod,mi)=>{
      const isOpen=!!expanded[mod.id];
      const modDone=mod.lessons.filter(l=>getLessonStatus(track.id,l.id)==='completed').length;
      const modWip =mod.lessons.filter(l=>getLessonStatus(track.id,l.id)==='in_progress').length;
      const lessonsHtml=mod.lessons.map(lesson=>{
        const st=getLessonStatus(track.id,lesson.id);
        return `<div class="lesson-row" onclick="openLesson('${track.id}','${lesson.id}')">
          <div class="lesson-status-icon">${statusIcon(st)}</div>
          <div class="lesson-text">
            <div class="lesson-title-text${st==='completed'?' done':st==='in_progress'?' wip':''}">${esc(lesson.title)}</div>
          </div>
          <div class="lesson-dur">${fmtMin(lesson.min)}</div>
        </div>`;
      }).join('');
      const badgeLabel=modDone===mod.lessons.length?'Complete':modWip>0?`${modDone+modWip} active`:`${modDone}/${mod.lessons.length}`;
      return `<div class="module-row">
        <div class="module-head" onclick="toggleModule('${mod.id}')">
          <div class="module-left">
            <div class="module-num">0${mi+1}</div>
            <div class="module-title-text">${esc(mod.title)}</div>
          </div>
          <div class="module-right">
            <div class="module-badge">${badgeLabel}</div>
            <div class="module-arrow${isOpen?' open':''}">▾</div>
          </div>
        </div>
        <div class="module-lessons${isOpen?' open':''}">${lessonsHtml}</div>
      </div>`;
    }).join('');
    return `<div class="track-card">
      <div class="track-head">
        <div class="track-emoji">${track.emoji}</div>
        <div class="track-info">
          <div class="track-title">${esc(track.title)}</div>
          <div class="track-desc">${esc(track.desc)}</div>
        </div>
        <div class="track-pct" style="color:${track.accent}">${pct}%</div>
      </div>
      <div class="track-bar-track"><div class="track-bar-fill" style="width:${pct}%;background:${track.accent}"></div></div>
      <div class="track-meta">${done} of ${total} lessons complete</div>
      ${modulesHtml}
    </div>`;
  }).join('');
}

// ── Today ──
function renderToday(){
  const el=document.getElementById('todayContent'); if(!el) return;
  const todMin=todayMinutes(), streak=calcStreak();
  const pct=Math.min(100,dailyGoal>0?Math.round(todMin/dailyGoal*100):0);
  const goalMet=todMin>=dailyGoal;
  const next=getNextLesson();

  const nextHtml=next
    ?`<div class="section-lbl">Up Next</div>
      <div class="up-next-card" onclick="openLesson('${next.track.id}','${next.lesson.id}')">
        <div class="up-next-track-lbl" style="color:${next.track.accent}">${esc(next.track.title)} · ${esc(next.mod.title)}</div>
        <div class="up-next-title">${esc(next.lesson.title)}</div>
        <div class="up-next-meta">${fmtMin(next.lesson.min)} estimated · tap to open</div>
        <button class="start-btn" onclick="event.stopPropagation();openLesson('${next.track.id}','${next.lesson.id}')">Start Session →</button>
      </div>`
    :`<div class="all-done">🎉 All lessons complete — check back for new tracks soon.</div>`;

  el.innerHTML=`
    <div class="today-grid">
      <div>
        <div class="today-lbl">Today's Learning</div>
        <div class="today-big">${todMin} min${goalMet?' ✓':''}</div>
        <div class="today-sub">Goal: ${dailyGoal} min
          &nbsp;<button class="today-goal-link" onclick="setDailyGoal()">change</button>
        </div>
        <div class="goal-bar-track"><div class="goal-bar-fill" style="width:${pct}%"></div></div>
        <div class="log-btns">
          <button class="log-btn" onclick="logTime(15)">+15</button>
          <button class="log-btn" onclick="logTime(30)">+30</button>
          <button class="log-btn" onclick="logTime(60)">+60</button>
          <button class="log-btn" onclick="logTime('custom')">+?</button>
        </div>
      </div>
      <div class="today-divider"></div>
      <div>
        <div class="today-lbl">Streak</div>
        <div class="today-big" style="color:${streak>0?'#d97706':'#cbd5e1'}">${streak>0?streak:0}</div>
        <div class="today-sub">${streak>0?`day${streak!==1?'s':''} in a row`:'Log today to start'}</div>
        ${streak>0?`<div class="streak-row">🔥 Keep it going</div>`:''}
      </div>
    </div>
    ${nextHtml}`;
}

// ── Progress ──
function renderProgress(){
  const el=document.getElementById('progressContent'); if(!el) return;
  const allP=calcAllProgress();
  const streak=calcStreak(), totMin=totalMinutes();

  const now=new Date();
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const y=d.getFullYear(), m=d.getMonth();
    const key=`${y}-${String(m+1).padStart(2,'0')}`;
    const min=learningLog.filter(e=>e.date.startsWith(key)).reduce((s,e)=>s+e.minutes,0);
    months.push({lbl:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m], min});
  }
  const maxMin=Math.max(...months.map(m=>m.min),1);
  const barsHtml=months.map(m=>`
    <div class="m-bar-col">
      <div class="m-bar-fill" style="height:${Math.round(m.min/maxMin*48)+4}px;${m.min>0?'':'opacity:.25'}"></div>
      <div class="m-bar-lbl">${m.lbl}</div>
    </div>`).join('');

  const trackRowsHtml=TRACKS.map(t=>{
    const {done,total,pct}=calcTrackProgress(t.id);
    const trackMin=learningLog.filter(e=>e.trackId===t.id).reduce((s,e)=>s+e.minutes,0);
    return `<div class="prog-track-row">
      <div class="prog-head">
        <div class="prog-name">${t.emoji} ${esc(t.title)}</div>
        <div class="prog-pct">${pct}%</div>
      </div>
      <div class="prog-bar-track"><div class="prog-bar-fill" style="width:${pct}%;background:${t.accent}"></div></div>
      <div class="prog-meta">${done} of ${total} lessons · ${fmtMin(trackMin)||'0m'} logged</div>
    </div>`;
  }).join('');

  el.innerHTML=`
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">${allP.done}</div><div class="stat-lbl">Lessons Done</div></div>
      <div class="stat-card"><div class="stat-num">${fmtMin(totMin)||'0'}</div><div class="stat-lbl">Total Time</div></div>
      <div class="stat-card"><div class="stat-num">${streak}</div><div class="stat-lbl">Day Streak</div></div>
      <div class="stat-card"><div class="stat-num">${allP.pct}%</div><div class="stat-lbl">Overall</div></div>
    </div>
    ${trackRowsHtml}
    <div class="activity-card">
      <div class="today-lbl">Monthly Activity</div>
      <div class="month-bars">${barsHtml}</div>
    </div>`;
}

// ── Notes ──
function renderNotes(){
  const el=document.getElementById('notesContent'); if(!el) return;

  // Collect all lesson notes
  let allLessonNotes=[];
  TRACKS.forEach(track=>{
    track.modules.forEach(mod=>{
      mod.lessons.forEach(lesson=>{
        const notes=getLessonNotes(track.id,lesson.id);
        if(notes.trim()) allLessonNotes.push({track,mod,lesson,notes});
      });
    });
  });

  const lessonNotesHtml = allLessonNotes.length > 0
    ? allLessonNotes.map(({track,lesson,notes})=>`
        <div class="lesson-note-card">
          <div class="lesson-note-head">
            <div class="lesson-note-title">${esc(lesson.title)}</div>
            <div class="lesson-note-track" style="color:${track.accent};background:${track.accentBg}">${track.emoji} ${esc(track.title)}</div>
          </div>
          <div class="lesson-note-body">${esc(notes)}</div>
        </div>`).join('')
    : `<div class="notes-empty">Lesson notes will appear here as you complete lessons.</div>`;

  el.innerHTML=`
    <div class="notes-pad-card">
      <div class="notes-pad-head">
        <div class="notes-pad-title">📓 General Notes</div>
        <div class="notes-saved-indicator" id="notesSavedInd">Saved</div>
      </div>
      <textarea class="notes-pad-textarea" id="generalNotesArea"
        placeholder="Ideas, reflections, goals, anything you want to remember…"
        oninput="onGeneralNotesInput()">${esc(generalNotes)}</textarea>
    </div>
    <div class="section-lbl" style="margin-top:8px">Lesson Notes</div>
    ${lessonNotesHtml}`;
}

function onGeneralNotesInput(){
  const el=document.getElementById('generalNotesArea');
  if(!el) return;
  generalNotes=el.value;
  saveLocal();
  clearTimeout(notesSaveTimer);
  notesSaveTimer=setTimeout(()=>{
    flushToSupabase();
    const ind=document.getElementById('notesSavedInd');
    if(ind){ ind.style.opacity='1'; setTimeout(()=>ind.style.opacity='0',1500); }
  }, 1000);
}

// ═══════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════
function switchTab(tab){
  activeTab=tab;
  ['tracks','today','progress','notes'].forEach(t=>{
    document.getElementById('nav-'+t).classList.toggle('active',t===tab);
    document.getElementById('panel-'+t).classList.toggle('active',t===tab);
  });
}

function toggleModule(modId){
  expanded[modId]=!expanded[modId];
  renderTracks();
}

// ═══════════════════════════════════════════
// LESSON MODAL
// ═══════════════════════════════════════════
function openLesson(trackId, lessonId){
  const track=TRACKS.find(t=>t.id===trackId); if(!track) return;
  let lesson=null, mod=null;
  for(const m of track.modules){ const l=m.lessons.find(l=>l.id===lessonId); if(l){lesson=l;mod=m;break;} }
  if(!lesson) return;
  modalCtx={trackId,lessonId};
  modalStatus=getLessonStatus(trackId,lessonId);
  modalNewMin=0;
  const notes=getLessonNotes(trackId,lessonId);
  const lessonMin=learningLog.filter(e=>e.trackId===trackId&&e.lessonId===lessonId).reduce((s,e)=>s+e.minutes,0);

  const pillsHtml=[
    {key:'not_started',  label:'Not Started'},
    {key:'in_progress',  label:'In Progress'},
    {key:'completed',    label:'Completed'},
  ].map(p=>{
    const active=modalStatus===p.key;
    const color=p.key==='completed'?'#22c55e':p.key==='in_progress'?'#d97706':'#7c3aed';
    return `<button type="button" class="s-pill" id="sp_${p.key}" onclick="selectStatus('${p.key}')"
      style="${active?`border:2px solid ${color};background:${color}22;color:${color}`:''}">${p.label}</button>`;
  }).join('');

  document.getElementById('modalCard').innerHTML=`
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-track-lbl" style="color:${track.accent}">${esc(track.title)} · ${esc(mod.title)}</div>
    <div class="modal-lesson-title">${esc(lesson.title)}</div>
    <div class="modal-desc">${esc(lesson.desc)}</div>
    ${lesson.content ? `<span class="m-lbl">Lesson</span><div class="m-lesson-content">${lesson.content}</div>` : ''}
    <span class="m-lbl">Status</span>
    <div class="status-pills">${pillsHtml}</div>
    <span class="m-lbl">Notes & Takeaways</span>
    <textarea class="m-textarea" id="mNotes" rows="5" placeholder="Key insights, quotes, things to practice…">${esc(notes)}</textarea>
    <div class="modal-log-row">
      <span class="modal-log-lbl">Log time:</span>
      <button class="modal-log-btn" onclick="addModalMin(15)">+15m</button>
      <button class="modal-log-btn" onclick="addModalMin(30)">+30m</button>
      <button class="modal-log-btn" onclick="addModalMin(60)">+60m</button>
      <span class="modal-time-logged" id="modalMinDisplay">${lessonMin>0?fmtMin(lessonMin)+' logged':''}${modalNewMin>0?' (+'+modalNewMin+'m)':''}</span>
    </div>
    <button class="save-btn" onclick="saveLesson()">Save</button>`;

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
  initQuizStates(trackId, lessonId);
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
  modalCtx=null; modalNewMin=0;
}

function selectStatus(s){
  modalStatus=s;
  const colors={completed:'#22c55e', in_progress:'#d97706', not_started:'#7c3aed'};
  ['not_started','in_progress','completed'].forEach(k=>{
    const pill=document.getElementById('sp_'+k); if(!pill) return;
    const active=k===s;
    pill.style.border=active?`2px solid ${colors[k]}`:'1px solid #e2e8f0';
    pill.style.background=active?`${colors[k]}22`:'transparent';
    pill.style.color=active?colors[k]:'';
  });
}

function addModalMin(n){
  modalNewMin+=n;
  const {trackId,lessonId}=modalCtx||{};
  const lessonMin=learningLog.filter(e=>e.trackId===trackId&&e.lessonId===lessonId).reduce((s,e)=>s+e.minutes,0);
  const el=document.getElementById('modalMinDisplay');
  if(el) el.textContent=(lessonMin>0?fmtMin(lessonMin)+' logged ':'')+`(+${modalNewMin}m)`;
}

function saveLesson(){
  const {trackId,lessonId}=modalCtx||{}; if(!trackId||!lessonId) return;
  if(!progress[trackId]) progress[trackId]={};
  const prev=progress[trackId][lessonId]||{};
  progress[trackId][lessonId]={
    status: modalStatus,
    notes: document.getElementById('mNotes')?.value||'',
    completedAt: modalStatus==='completed'?(prev.completedAt||new Date().toISOString()):null,
    quizResults: prev.quizResults||[],
  };
  if(modalNewMin>0){
    learningLog.push({date:todayStr(), minutes:modalNewMin, trackId, lessonId});
  }
  persistData(); render(); closeModal();
}


function revealQuizAnswer(btn){
  btn.style.display='none';
  const reveal=btn.nextElementSibling;
  if(reveal) reveal.style.display='block';
}

function markQuiz(btn, result){
  const sc=btn.parentElement;
  const quizIdx=[...document.querySelectorAll('.quiz-self-check')].indexOf(sc);
  const label=result==='got'
    ? '<span class="quiz-result-label got">✓ Got it!</span>'
    : '<span class="quiz-result-label missed">✗ Review this one</span>';
  sc.innerHTML=label;
  // Persist result
  const {trackId,lessonId}=modalCtx||{};
  if(!trackId||!lessonId) return;
  if(!progress[trackId]) progress[trackId]={};
  if(!progress[trackId][lessonId]) progress[trackId][lessonId]={};
  if(!progress[trackId][lessonId].quizResults) progress[trackId][lessonId].quizResults=[];
  progress[trackId][lessonId].quizResults[quizIdx]=result;
  persistData();
}

function initQuizStates(trackId,lessonId){
  const results=(progress[trackId]&&progress[trackId][lessonId]&&progress[trackId][lessonId].quizResults)||[];
  if(!results.length) return;
  const quizSCs=document.querySelectorAll('.quiz-self-check');
  quizSCs.forEach((sc,i)=>{
    if(!results[i]) return;
    // Reveal the answer section
    const revealDiv=sc.closest('.quiz-reveal');
    if(revealDiv) revealDiv.style.display='block';
    // Hide the Check Answer button
    const revealBtn=revealDiv?.previousElementSibling;
    if(revealBtn&&revealBtn.classList.contains('quiz-reveal-btn')) revealBtn.style.display='none';
    // Show prior result
    const label=results[i]==='got'
      ? '<span class="quiz-result-label got">✓ Got it!</span>'
      : '<span class="quiz-result-label missed">✗ Review this one</span>';
    sc.innerHTML=label;
  });
}

// ═══════════════════════════════════════════
// DAILY LOG
// ═══════════════════════════════════════════
function logTime(n){
  if(n==='custom'){
    const v=prompt('Minutes learned:',''); const p=parseInt(v); if(!p||p<1) return; n=p;
  }
  learningLog.push({date:todayStr(), minutes:n});
  persistData(); renderToday(); renderProgress();
}

function setDailyGoal(){
  const v=prompt('Daily learning goal (minutes):',dailyGoal); if(v===null) return;
  const n=parseInt(v); if(!n||n<1) return;
  dailyGoal=n;
  localStorage.setItem('le_daily_goal',String(n));
  renderToday();
}
</script>
